<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>مار و پله | دهات</title>
<script>
// ---------- سینکِ تمِ سایتِ اصلی، دقیقاً همون الگویِ dooz.html ----------
(function () {
  try {
    var pdoc = window.parent && window.parent !== window ? window.parent.document : null;
    var theme, bg;
    if (pdoc) {
      var proot = pdoc.documentElement;
      theme = proot.getAttribute("data-theme");
      bg = proot.getAttribute("data-bg");
    }
    if (!theme) {
      var LEGACY_MAP = { purple: "purple-dark", dark: "walnut-dark", red: "red-dark", blue: "blue-dark", teal: "pure-dark", emerald: "emerald-dark" };
      var t = localStorage.getItem("theme") || "purple-dark";
      if (LEGACY_MAP[t]) t = LEGACY_MAP[t];
      var parts = t.split("-");
      theme = parts[0] + "-" + parts[1];
      bg = parts[2] === "bg" ? "on" : "off";
    }
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.setAttribute("data-bg", bg || "off");
  } catch (e) {}
})();
</script>
<style>
  @font-face { font-family: 'Vazirmatn'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/Vazirmatn-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Vazirmatn'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/Vazirmatn-Bold.woff2') format('woff2'); }
  @font-face { font-family: 'Vazirmatn'; font-style: normal; font-weight: 800; font-display: swap; src: url('/fonts/Vazirmatn-ExtraBold.woff2') format('woff2'); }

  :root {
    --primary: #1A0A31; --surface: #241243; --card: #2D1856;
    --accent: #8B5CF6; --accent-hover: #A78BFA; --text: #FFFFFF; --subtext: #C9C4D8;
    --border: #3D2A64; --success: #22C55E; --error: #EF4444; --radius: 16px;
    --accent-gradient: linear-gradient(135deg, var(--accent), var(--accent-hover));
    --card-gradient: linear-gradient(160deg, var(--card), var(--surface));
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--primary); color: var(--text);
    font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
    overflow: hidden; position: relative; min-height: 100vh;
    display: flex; align-items: stretch; justify-content: center;
  }

  .app { position: relative; z-index: 1; width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; }
  .screen { flex: 1; display: none; flex-direction: column; min-height: 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); animation: fadeIn .25s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  h1, h2, h3 { margin: 0; font-family: 'Vazirmatn'; }
  p { margin: 0; }
  button { font-family: 'Vazirmatn'; cursor: pointer; border: none; }

  .topline { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 12px; flex-shrink: 0; }
  .topline .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
  .topline .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-gradient); }
  .me-chip { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px 3px 3px; }
  .me-chip img, .avatar-fallback { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .me-chip span { font-size: 12px; color: var(--subtext); }

  .center-msg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 30px; }
  .center-msg .icon { width: 56px; height: 56px; opacity: .85; }
  .center-msg h2 { font-size: 16px; }
  .center-msg p { color: var(--subtext); font-size: 13px; line-height: 1.9; }
  .spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-back-site { margin-top: 4px; background: var(--accent-gradient); color: #fff; font-size: 13px; font-weight: 700; padding: 10px 20px; border-radius: 12px; }

  .card { background: var(--card-gradient); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .btn-primary { background: var(--accent-gradient); color: #fff; font-weight: 800; font-size: 14px; padding: 13px; border-radius: 14px; box-shadow: 0 8px 20px -8px var(--accent); }
  .btn-primary:disabled { opacity: .45; box-shadow: none; }
  .btn-ghost { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 13px; padding: 13px 16px; border-radius: 14px; }

  /* ---------- لابی ---------- */
  .lobby-tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 12px; flex-shrink: 0; }
  .lobby-tab { flex: 1; text-align: center; padding: 9px 4px; border-radius: 9px; font-size: 12.5px; color: var(--subtext); font-weight: 700; background: transparent; }
  .lobby-tab.active { background: var(--accent-gradient); color: #fff; }
  .lobby-panels { flex: 1; overflow-y: auto; min-height: 0; }
  .lobby-panel { display: none; flex-direction: column; gap: 10px; }
  .lobby-panel.active { display: flex; }
  .room-row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; }
  .rr-name { font-size: 13px; font-weight: 700; }
  .rr-sub { font-size: 11px; color: var(--subtext); }
  .btn-join { background: var(--accent-gradient); color: #fff; font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 10px; flex-shrink: 0; }
  .empty-hint { text-align: center; color: var(--subtext); font-size: 12.5px; padding: 30px 10px; line-height: 1.9; }
  .field-label { font-size: 12px; color: var(--subtext); margin-bottom: 6px; display: block; }
  .field-input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-family: 'Vazirmatn'; text-align: center; letter-spacing: 1px; }
  .field-input:focus { outline: none; border-color: var(--accent); }
  .quick-actions { display: flex; flex-direction: column; gap: 10px; }
  .quick-card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .quick-card .qc-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 19px; }
  .quick-card .qc-text { flex: 1; }
  .quick-card .qc-title { font-size: 13.5px; font-weight: 700; }
  .quick-card .qc-sub { font-size: 11px; color: var(--subtext); margin-top: 2px; }
  .quick-card .qc-arrow { color: var(--subtext); }
  .visibility-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
  .visibility-toggle button { flex: 1; padding: 9px; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--subtext); background: transparent; }
  .visibility-toggle button.active { background: var(--accent-gradient); color: #fff; }

  /* ---------- اتاقِ انتظار ---------- */
  .waiting-code { text-align: center; margin: 10px 0 16px; }
  .waiting-code .wc-label { font-size: 12px; color: var(--subtext); margin-bottom: 8px; }
  .waiting-code .wc-code { font-size: 30px; font-weight: 800; letter-spacing: 6px; color: var(--accent-hover); }
  .waiting-copy-btn { margin-top: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 12px; padding: 8px 16px; border-radius: 10px; }
  .waiting-anim { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 14px 0; }
  .waiting-anim span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: bounceDot 1.2s infinite ease-in-out; }
  .waiting-anim span:nth-child(2) { animation-delay: .15s; }
  .waiting-anim span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounceDot { 0%,80%,100%{ transform: translateY(0); opacity:.4; } 40%{ transform: translateY(-8px); opacity:1; } }

  /* ---------- صفحه‌ی بازی ---------- */
  .players-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; margin-bottom: 10px; }
  .player-chip { display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 7px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); max-width: 46%; }
  .player-chip.turn { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .player-chip img, .player-chip .avatar-fallback { width: 28px; height: 28px; flex-shrink: 0; }
  .player-chip .pc-info { min-width: 0; }
  .player-chip .pc-name { font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 84px; }
  .player-chip .pc-status { font-size: 9.5px; color: var(--subtext); }
  .player-chip.disconnected { opacity: .5; }
  .vs-mid { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--subtext); font-weight: 700; flex-shrink: 0; }

  .leave-fab { position: absolute; top: 10px; left: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--subtext); z-index: 4; }
  .leave-fab svg { width: 16px; height: 16px; }

  .board-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; gap: 12px; }
  .board { width: min(92vw, 400px); height: min(92vw, 400px); display: grid; grid-template-columns: repeat(10,1fr); grid-template-rows: repeat(10,1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; position: relative; }
  .sq { background: var(--card); position: relative; display: flex; align-items: flex-start; justify-content: flex-end; }
  .sq:nth-child(odd) { background: color-mix(in srgb, var(--card) 88%, var(--surface)); }
  .sq-num { font-size: 6.5px; color: var(--subtext); padding: 1px 2px; opacity: .75; }
  .sq-tag { position: absolute; bottom: 1px; left: 1px; font-size: 8px; line-height: 1; }
  .sq.start { background: color-mix(in srgb, var(--success) 22%, var(--card)); }
  .sq.finish { background: color-mix(in srgb, var(--accent) 30%, var(--card)); }
  .token-layer { position: absolute; inset: 0; pointer-events: none; }
  .token { position: absolute; width: 7.4%; height: 7.4%; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--text); background: var(--surface); transition: top .5s cubic-bezier(.34,1.2,.4,1), right .5s cubic-bezier(.34,1.2,.4,1); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .token img { width: 100%; height: 100%; object-fit: cover; }
  .token.tok-b { border-color: var(--accent); }

  .dice-row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-shrink: 0; }
  .dice-face { width: 52px; height: 52px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; }
  .dice-face.rolling { animation: diceShake .5s ease; }
  @keyframes diceShake { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-14deg);} 75%{transform:rotate(14deg);} }
  .btn-roll { background: var(--accent-gradient); color: #fff; font-weight: 800; font-size: 14px; padding: 13px 26px; border-radius: 14px; box-shadow: 0 8px 20px -8px var(--accent); }
  .btn-roll:disabled { opacity: .4; box-shadow: none; }
  .turn-hint { text-align: center; font-size: 12px; color: var(--subtext); flex-shrink: 0; }

  /* ---------- مودالِ عمومی ---------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .25s; padding: 16px; }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal-box { background: var(--card-gradient); border: 1px solid var(--border); border-radius: 22px; padding: 22px; width: min(92vw, 340px); text-align: center; transform: scale(.85) translateY(10px); transition: transform .25s; max-height: 88vh; overflow-y: auto; }
  .modal-backdrop.open .modal-box { transform: scale(1) translateY(0); }
  .modal-box .trophy { font-size: 46px; margin-bottom: 6px; display: block; }
  .modal-box h3 { font-size: 17px; margin-bottom: 4px; }
  .modal-box p { color: var(--subtext); font-size: 12.5px; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; }

  /* ---------- گردونه‌ی فلاکت ---------- */
  .wheel-emoji { font-size: 54px; display: block; margin-bottom: 10px; animation: wheelSpin 1s ease-out; }
  @keyframes wheelSpin { from { transform: rotate(0deg); } to { transform: rotate(900deg); } }
  .wheel-options { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
  .wheel-opt { padding: 9px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 12.5px; }
  .wheel-opt.picked { background: var(--accent-gradient); color: #fff; font-weight: 800; border-color: transparent; }

  /* ---------- مینی‌گیم: سیم‌شوک ---------- */
  .buzz-wrap { width: 100%; height: 280px; margin: 6px 0 14px; touch-action: none; position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .buzz-wrap.buzz { animation: buzzFlash .15s ease; }
  @keyframes buzzFlash { 0%,100%{ background: var(--surface);} 50%{ background: color-mix(in srgb, var(--error) 40%, var(--surface)); } }
  .buzz-ring { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--accent-hover); background: transparent; transform: translate(-50%,-50%); }

  /* ---------- مینی‌گیم: پازلِ عاقی ---------- */
  .jigsaw-grid { display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); gap: 3px; width: 220px; height: 220px; margin: 6px auto 12px; }
  .jigsaw-tile { border-radius: 6px; cursor: pointer; border: 2px solid transparent; background-size: 300% 300%; position: relative; }
  .jigsaw-tile-num { position: absolute; top: 2px; left: 2px; min-width: 15px; height: 15px; padding: 0 2px; background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; line-height: 15px; text-align: center; border-radius: 4px; pointer-events: none; }
  .jigsaw-tile.selected { border-color: var(--accent); }
  .jigsaw-tile.solved { border-color: var(--success); }

  /* ---------- مینی‌گیم: همستر کامبت ---------- */
  .hamster-timerbar-wrap { height: 8px; border-radius: 999px; background: var(--surface); overflow: hidden; margin: 8px 0 14px; }
  .hamster-timerbar { height: 100%; background: var(--accent-gradient); width: 100%; transition: width .1s linear; }
  .hamster-btn { width: 130px; height: 130px; border-radius: 50%; background: var(--card); border: 3px solid var(--border); font-size: 60px; margin: 0 auto; display: flex; align-items: center; justify-content: center; user-select: none; }
  .hamster-btn.tap { animation: hamsterTap .1s ease; }
  @keyframes hamsterTap { 50% { transform: scale(.88); } }
  .hamster-count { font-size: 22px; font-weight: 800; margin: 10px 0 2px; }

  .toast-err { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--error); color: #fff; font-size: 12.5px; font-weight: 700; padding: 10px 18px; border-radius: 12px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 30; white-space: nowrap; }
  .toast-err.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast-info { position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 12px; font-weight: 700; padding: 9px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 30; }
  .toast-info.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">

  <div class="screen" id="screenBlock">
    <div class="center-msg">
      <div class="spinner" id="blockSpinner"></div>
      <h2 id="blockTitle">در حالِ اتصال...</h2>
      <p id="blockText">چند لحظه صبر کن</p>
    </div>
  </div>

  <div class="screen" id="screenLobby">
    <div class="topline">
      <div class="brand"><span class="dot"></span> مار و پله</div>
      <div class="me-chip" id="meChip"></div>
    </div>
    <div class="lobby-tabs">
      <button class="lobby-tab active" data-tab="quick">سریع</button>
      <button class="lobby-tab" data-tab="public">روم‌های باز</button>
      <button class="lobby-tab" data-tab="code">کد دارم</button>
    </div>
    <div class="lobby-panels">
      <div class="lobby-panel active" data-panel="quick">
        <div class="quick-actions">
          <button class="quick-card" id="btnCreatePublic">
            <div class="qc-icon">🌍</div>
            <div class="qc-text"><div class="qc-title">یه روم عمومی بزن</div><div class="qc-sub">هر کسی از لابی می‌تونه بیاد توش</div></div>
            <span class="qc-arrow">‹</span>
          </button>
          <button class="quick-card" id="btnCreatePrivate">
            <div class="qc-icon">🔒</div>
            <div class="qc-text"><div class="qc-title">یه روم خصوصی بزن</div><div class="qc-sub">فقط با کد می‌شه واردش شد</div></div>
            <span class="qc-arrow">‹</span>
          </button>
        </div>
      </div>
      <div class="lobby-panel" data-panel="public"><div id="publicList"></div></div>
      <div class="lobby-panel" data-panel="code">
        <label class="field-label">کدِ رومو وارد کن</label>
        <input class="field-input" id="codeInput" placeholder="مثلاً: A3F9K" maxlength="8" />
        <button class="btn-primary" id="btnJoinCode" style="margin-top:10px; width:100%;">ورود به روم</button>
      </div>
    </div>
  </div>

  <div class="screen" id="screenWaiting">
    <div class="topline">
      <div class="brand"><span class="dot"></span> مار و پله</div>
      <button class="btn-ghost" id="btnLeaveWaiting" style="padding:7px 12px; font-size:12px;">خروج</button>
    </div>
    <div class="card" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div class="waiting-code">
        <div class="wc-label">کدِ روم — بفرستش برای دوستت</div>
        <div class="wc-code" id="waitingCode">------</div>
        <button class="waiting-copy-btn" id="btnCopyCode">کپیِ کد</button>
      </div>
      <div class="waiting-anim"><span></span><span></span><span></span></div>
      <p style="text-align:center; color:var(--subtext); font-size:12.5px;">منتظرِ ورودِ حریف...</p>
      <div id="visibilityBox" style="margin-top:18px; display:none;">
        <div class="field-label" style="text-align:center;">نوعِ روم</div>
        <div class="visibility-toggle">
          <button data-v="public" id="vPublic">عمومی</button>
          <button data-v="private" id="vPrivate">خصوصی</button>
        </div>
      </div>
    </div>
  </div>

  <div class="screen" id="screenGame" style="position:relative;">
    <button class="leave-fab" id="btnLeaveGame" title="ترکِ بازی">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" strok

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رادیونمای دهات</title>
<style>
  /* فونت وزیرمتن خودمیزبان — فایل‌های woff2 باید تو مسیرِ /fonts/ همین پروژه باشن */
  @font-face { font-family: 'Vazirmatn'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/Vazirmatn-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Vazirmatn'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/Vazirmatn-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Vazirmatn'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/Vazirmatn-Bold.woff2') format('woff2'); }

  :root {
    --primary: #1A0A31;
    --surface: #241243;
    --card: #2D1856;
    --accent: #8B5CF6;
    --accent-hover: #A78BFA;
    --text: #FFFFFF;
    --subtext: #C9C4D8;
    --border: #3D2A64;
    --success: #22C55E;
    --error: #EF4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    color: var(--text);
    background: var(--primary);
    position: relative;
  }

  /* ---------- پس‌زمینه‌ی تمام‌صفحه‌ی رادیونما: دو لایه برای کراس‌فیدِ نرم بینِ عکس/ویدیوها ---------- */
  .bg-layer {
    position: fixed; inset: 0; opacity: 0; transition: opacity 1.1s ease;
    background: var(--primary); overflow: hidden;
  }
  .bg-layer.visible { opacity: 1; }
  .bg-layer img, .bg-layer video {
    width: 100%; height: 100%; object-fit: cover;
  }
  .bg-scrim {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, rgba(10,4,20,0.55) 0%, rgba(10,4,20,0.25) 35%, rgba(10,4,20,0.35) 65%, rgba(10,4,20,0.75) 100%);
    pointer-events: none;
  }
  .bg-empty-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--subtext); font-size: 13px; opacity: 0.6; }

  /* ---------- گوشه‌ی راستِ بالا: چیپِ فرستنده‌ی آهنگ (آواتار+یوزرنیم) + بجِ پخشِ زنده، زیرِ هم ---------- */
  .top-right-stack {
    position: fixed; top: 18px; right: 18px; z-index: 5;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .sender-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(36,18,67,0.72); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 13px 5px 5px;
    max-width: 55vw; opacity: 0; transform: translateY(-6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .sender-chip.visible { opacity: 1; transform: translateY(0); }
  .sender-avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
  }
  .sender-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sender-username {
    font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .top-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--subtext); background: rgba(36,18,67,0.65); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--error); animation: livePulse 1.4s ease-in-out infinite; }
  .top-badge.idle .live-dot { background: var(--subtext); animation: none; }
  @keyframes livePulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(239,68,68,0.5); } 50% { opacity: 0.6; box-shadow: 0 0 0 5px rgba(239,68,68,0); } }

  /* ---------- گوشه‌ی چپِ بالا: ساعتِ دقیقِ دائمی + زیرش کادرِ «بعدی» ---------- */
  .top-left-stack { position: fixed; top: 18px; left: 18px; z-index: 5; display: flex; flex-direction: column; gap: 8px; max-width: 62vw; }
  .live-clock {
    display: inline-flex; align-self: flex-start; align-items: baseline; gap: 3px;
    background: rgba(36,18,67,0.65); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
    letter-spacing: 0.5px; font-weight: 700; font-size: 15px; color: var(--text);
    direction: ltr;
  }
  .live-clock .clock-sec { font-size: 11px; font-weight: 500; color: var(--subtext); }

  .next-up-box {
    background: rgba(36,18,67,0.75); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: 12px; padding: 9px 13px;
    opacity: 0; transform: translateY(-8px); pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .next-up-box.visible { opacity: 1; transform: translateY(0); }
  .next-up-label { font-size: 10.5px; color: var(--accent-hover); margin: 0 0 2px; }
  .next-up-title { font-size: 13px; font-weight: 500; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- محتوای مرکزی: عنوانِ آهنگِ در حال پخش + نوارِ پیشرفتِ ظریف ---------- */
  .now-playing {
    position: fixed; right: 18px; bottom: 22px; left: 18px; z-index: 5;
    text-align: right;
  }
  .now-title { font-size: 19px; font-weight: 700; margin: 0 0 3px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  .now-performer { font-size: 13.5px; color: var(--subtext); margin: 0 0 12px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .now-progress-track { height: 3px; border-radius: 3px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .now-progress-fill { height: 100%; background: var(--accent-hover); border-radius: 3px; width: 0%; }

  /* ---------- ژستِ ورود: یه دکمه‌ی یک‌بارمصرف، فقط برای رفعِ محدودیتِ خودکارپخشیِ مرورگرها ---------- */
  .enter-overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 30% 20%, #2a1550 0%, var(--primary) 60%);
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  .enter-overlay.hidden-overlay { opacity: 0; visibility: hidden; pointer-events: none; }
  .enter-title { font-size: 20px; font-weight: 700; margin: 0; }
  .enter-sub { font-size: 13px; color: var(--subtext); margin: 0; text-align: center; max-width: 260px; }
  .enter-btn {
    width: 76px; height: 76px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .enter-btn:hover { background: var(--accent-hover); }
  .enter-btn:active { transform: scale(0.94); }
  .enter-btn svg { width: 28px; height: 28px; margin-inline-start: 3px; }

  .radio-status {
    position: fixed; bottom: 8px; left: 0; right: 0; z-index: 5;
    text-align: center; font-size: 11.5px; color: var(--subtext); opacity: 0.8;
  }
  .radio-status.error { color: var(--error); }

  /* ---------- دکمه‌ی شناور ضبطِ ویس: بالای نوارِ نام‌آهنگ، وسطِ صفحه ---------- */
  .voice-record-btn {
    position: fixed; bottom: 108px; left: 50%; transform: translateX(-50%); z-index: 6;
    width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer;
    background: var(--card); color: var(--text); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .voice-record-btn svg { width: 23px; height: 23px; }
  .voice-record-btn.recording { background: var(--error); border-color: var(--error); }
  .voice-record-btn:active { transform: translateX(-50%) scale(0.92); }
  .voice-record-ring {
    position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--error);
    opacity: 0; pointer-events: none;
  }
  .voice-record-btn.recording .voice-record-ring { opacity: 1; animation: recPulse 1.2s ease-out infinite; }
  @keyframes recPulse { 0% { transform: scale(0.9); opacity: 0.9; } 100% { transform: scale(1.35); opacity: 0; } }
  .voice-status {
    position: fixed; bottom: 174px; left: 50%; transform: translateX(-50%); z-index: 6;
    font-size: 12px; color: var(--subtext); background: rgba(36,18,67,0.8); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease; white-space: nowrap; max-width: 80vw; overflow: hidden; text-overflow: ellipsis;
  }
  .voice-status.visible { opacity: 1; }
  .voice-status.error { color: var(--error); border-color: var(--error); }

  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none !important; }
    .bg-layer { transition: none !important; }
  }
</style>
</head>
<body>

<div class="bg-layer" id="bgLayerA"></div>
<div class="bg-layer" id="bgLayerB"></div>
<div class="bg-scrim"></div>
<div class="bg-empty-note" id="bgEmptyNote" style="display:none;">هنوز رسانه‌ای برای رادیونما تیک نخورده</div>

<div class="top-right-stack">
  <div class="sender-chip" id="senderChip">
    <span class="sender-avatar" id="senderAvatar"></span>
    <span class="sender-username" id="senderUsername"></span>
  </div>
  <div class="top-badge idle" id="topBadge"><span class="live-dot"></span><span id="topBadgeText">رادیونمای دهات</span></div>
</div>

<div class="top-left-stack">
  <div class="live-clock" id="liveClock"><span id="liveClockMain">--:--</span><span class="clock-sec" id="liveClockSec">--</span></div>
  <div class="next-up-box" id="nextUpBox">
    <p class="next-up-label">بعدی</p>
    <p class="next-up-title" id="nextUpTitle">—</p>
  </div>
</div>

<div class="now-playing">
  <p class="now-title" id="nowTitle">&nbsp;</p>
  <p class="now-performer" id="nowPerformer">&nbsp;</p>
  <div class="now-progress-track"><div class="now-progress-fill" id="nowProgressFill"></div></div>
</div>

<div class="radio-status" id="radioStatus"></div>

<button class="voice-record-btn" id="voiceRecordBtn" aria-label="ارسالِ ویس به صفِ رادیو" style="display:none;">
  <span class="voice-record-ring"></span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="2" width="6" height="12" rx="3"/>
    <path d="M5 10a7 7 0 0 0 14 0"/>
    <path d="M12 17v4"/>
    <path d="M9 21h6"/>
  </svg>
</button>
<div class="voice-status" id="voiceStatus"></div>

<div class="enter-overlay" id="enterOverlay">
  <p class="enter-title">رادیونمای دهات</p>
  <p class="enter-sub">پخشِ زنده و هم‌زمان برای همه؛ بدونِ امکانِ پاز یا رد کردن — دقیقاً مثلِ یه رادیوی واقعی</p>
  <button class="enter-btn" id="enterBtn" aria-label="ورود به رادیو">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>

<audio id="radioAudio" preload="auto"></audio>
<audio id="jingleAudio" preload="none"></audio>
<video id="radioBgVideoA" muted loop playsinline style="display:none;"></video>
<video id="radioBgVideoB" muted loop playsinline style="display:none;"></video>

<script>
const WORKER_URL = "";
function getToken() { return localStorage.getItem("token"); }

// دهات کاملاً خصوصیه؛ اگه توکن نداشته باشیم، اصلاً محتوایی نشون نمی‌دیم و می‌فرستیم به لاگین
if (!getToken()) {
  window.location.href = "login.html?next=radio.html";
}

function mediaUrl(fileId) {
  if (!fileId) return "";
  return `${WORKER_URL}/api/media/${encodeURIComponent(fileId)}?token=${encodeURIComponent(getToken() || "")}`;
}
function jingleUrl(name) {
  return `${WORKER_URL}/api/radio/jingle/file/${encodeURIComponent(name)}`;
}

async function fetchWithRetry(url, options, retries = 2, delayMs = 700) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(url, options);
      if (res.ok || attempt === retries) return res;
    } catch (e) {
      if (attempt === retries) throw e;
    }
    await new Promise((r) => setTimeout(r, delayMs * (attempt + 1)));
  }
}

const audio = document.getElementById("radioAudio");
const jingleAudio = document.getElementById("jingleAudio");
const enterOverlay = document.getElementById("enterOverlay");
const enterBtn = document.getElementById("enterBtn");
const topBadge = document.getElementById("topBadge");
const topBadgeText = document.getElementById("topBadgeText");
const nowTitle = document.getElementById("nowTitle");
const nowPerformer = document.getElementById("nowPerformer");
const nowProgressFill = document.getElementById("nowProgressFill");
const nextUpBox = document.getElementById("nextUpBox");
const nextUpTitle = document.getElementById("nextUpTitle");
const radioStatus = document.getElementById("radioStatus");
const bgEmptyNote = document.getElementById("bgEmptyNote");

function setStatus(text, isError) {
  radioStatus.textContent = text || "";
  radioStatus.classList.toggle("error", !!isError);
}
function setLive(isLive) {
  topBadge.classList.toggle("idle", !isLive);
  topBadgeText.textContent = isLive ? "پخشِ زنده" : "رادیونمای دهات";
  // اگه این صفحه تو یه iframeِ داخلِ خودِ سایت بازه (نه یه تبِ جداگونه)، به صفحه‌ی اصلی خبر می‌ده تا
  // آیکونِ وضعیتِ رادیو تو هدرِ سایت (بینِ تایتل و پروفایل) آپدیت بشه
  try {
    window.parent.postMessage({ type: "dehaat-radio-status", playing: !!isLive }, "*");
  } catch (e) {}
}

// =========================================================================
// بخشِ ۱: پخشِ صوتی — همون منطقِ زمان‌بندیِ همگام، ولی بدونِ هیچ کنترلِ دستی برای کاربر
// (نه پاز، نه رد کردن)؛ فقط یه ژستِ ورودِ یک‌بارمصرف برای دورزدنِ محدودیتِ خودکارپخشیِ مرورگر.
// =========================================================================
let started = false;
let currentSegmentKey = null;
let currentDuration = 0;
let nextTrackTimer = null;
let nextUpTimer = null;
let progressTimer = null;
let inJingleTransition = false;
let crossfadeOutTimer = null;

// کراس‌فید فقط برای پایانِ آهنگ معنی داره، نه شروعش: ۱۰ ثانیه‌ی آخرِ هر آهنگ به‌آرومی صدا کم می‌شه
// و دقیقاً هم‌زمان با تمومِ‌شدنِ واقعیِ آهنگ به صفر می‌رسه؛ آهنگِ بعدی هیچ فیدی نداره، از همون لحظه‌ی
// اولش با صدای کامل شروع می‌شه.
const CROSSFADE_OUT_SECONDS = 10;
function scheduleCrossfadeOut(remainingSeconds) {
  clearTimeout(crossfadeOutTimer);
  const delay = Math.max(0, remainingSeconds - CROSSFADE_OUT_SECONDS);
  crossfadeOutTimer = setTimeout(() => {
    if (inJingleTransition || audio.paused) return;
    fadeVolume(audio, audio.volume || 1, 0, CROSSFADE_OUT_SECONDS * 1000);
  }, delay * 1000);
}

async function fetchRadioNow() {
  const res = await fetchWithRetry(`${WORKER_URL}/api/radio/now`, {
    headers: { Authorization: `Bearer ${getToken()}` },
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "رادیو در دسترس نیست");
  return data;
}

// ---------- کمکی‌های نمایشی: تبدیل ارقام فارسی، escape متن، رنگِ ثابتِ آواتار ----------
function toPersianDigits(str) {
  const fa = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];
  return String(str).replace(/[0-9]/g, (d) => fa[+d]);
}
function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function avatarColor(name) {
  const palette = ["#8B5CF6", "#22C55E", "#3B82F6", "#F59E0B", "#EF4444", "#EC4899"];
  let sum = 0;
  for (const ch of (name || "")) sum += ch.charCodeAt(0);
  return palette[sum % palette.length];
}

function updateNowPlayingUi(data) {
  const c = data.current;
  currentDuration = c.durationSeconds || 0;

  if (c.segmentType === "voice") {
    nowTitle.textContent = "🎙 پیامِ صوتی";
    nowPerformer.textContent = c.username ? `از طرفِ ${c.username}` : "";
  } else if (c.segmentType === "pause") {
    nowTitle.textContent = "چند لحظه دیگه...";
    nowPerformer.textContent = "";
  } else {
    nowTitle.textContent = c.title || "بدون‌نام";
    nowPerformer.textContent = c.performer || "";
  }

  // چیپِ فرستنده: آواتار (عکس واقعی یا حرفِ اول با رنگِ ثابت) + یوزرنیم — هم برای فرستنده‌ی آهنگ
  // و هم فرستنده‌ی ویس معنی داره؛ تو مکثِ کوتاه چیزی برای نشون‌دادن نیست، مخفی می‌شه.
  const senderChip = document.getElementById("senderChip");
  const senderAvatar = document.getElementById("senderAvatar");
  const senderUsername = document.getElementById("senderUsername");
  if (senderChip && senderAvatar && senderUsername) {
    if (c.segmentType === "pause" || !c.username) {
      senderChip.classList.remove("visible");
    } else {
      senderAvatar.innerHTML = c.avatarFileId ? `<img src="${mediaUrl(c.avatarFileId)}" alt="" />` : "";
      if (!c.avatarFileId) {
        senderAvatar.textContent = (c.username || "؟").trim().charAt(0).toUpperCase();
        senderAvatar.style.background = avatarColor(c.username || "");
      } else {
        senderAvatar.style.background = "transparent";
      }
      senderUsername.textContent = c.username || "";
      senderChip.classList.add("visible");
    }
  }
}

// ---------- ساعتِ دقیقِ بالا-چپ (بر مبنای وقتِ تهران، صرف‌نظر از تایم‌زونِ خودِ دستگاه) ----------
function updateClock() {
  const mainEl = document.getElementById("liveClockMain");
  const secEl = document.getElementById("liveClockSec");
  if (!mainEl || !secEl) return;
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Tehran", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  }).formatToParts(new Date());
  const get = (t) => parts.find((p) => p.type === t)?.value || "00";
  mainEl.textContent = toPersianDigits(`${get("hour")}:${get("minute")}`);
  secEl.textContent = toPersianDigits(get("second"));
}
updateClock();
setInterval(updateClock, 1000);

function scheduleNextUpPreview(remainingSeconds, nextData) {
  clearTimeout(nextUpTimer);
  nextUpBox.classList.remove("visible");
  if (!nextData) return;
  const PREVIEW_LEAD_SECONDS = 15;
  const delay = Math.max(0, remainingSeconds - PREVIEW_LEAD_SECONDS);
  nextUpTimer = setTimeout(() => {
    const label =
      nextData.type === "voice"
        ? "🎙 پیامِ صوتی"
        : nextData.title
        ? `${nextData.title}${nextData.performer ? " — " + nextData.performer : ""}`
        : "—";
    nextUpTitle.textContent = label;
    nextUpBox.classList.add("visible");
  }, delay * 1000);
}

// یه فیدِ نرمِ صدا (کراس‌فید) بینِ آهنگ‌ها؛ برای فیدِ خروجی from=1,to=0 و برای فیدِ ورودی from=0,to=1
function fadeVolume(el, from, to, durationMs) {
  return new Promise((resolve) => {
    const steps = 24;
    const stepMs = durationMs / steps;
    let i = 0;
    el.volume = from;
    const timer = setInterval(() => {
      i++;
      el.volume = Math.max(0, Math.min(1, from + (to - from) * (i / steps)));
      if (i >= steps) {
        clearInterval(timer);
        el.volume = to;
        resolve();
      }
    }, stepMs);
  });
}

// «remainingSeconds»ای که سرور می‌ده، لحظه‌ی ارسالِ جوابِ سرور دقیقه؛ ولی تا خودِ کلاینت جوابو
// بگیره و پردازش کنه، یه‌کم زمان (تاخیرِ شبکه، مخصوصاً رو اینترنتِ کند) گذشته. قبلاً این تاخیر رو
// حساب نمی‌کردیم، پس تایمرِ تعویضِ آهنگ گاهی چند ثانیه زودتر از پایانِ واقعیِ آهنگ فایر می‌شد و
// آهنگ رو ناقص قطع می‌کرد. الان به‌جای اعتماد کورکورانه به یه تایمرِ یک‌باره، هر بار که تایمر تموم
// شد اول از سرور می‌پرسیم «واقعاً وقتشه؟» — اگه سرور بگه هنوز همون آهنگه، فقط دوباره زمان‌بندی
// می‌کنیم و هیچی قطع نمی‌شه؛ یعنی حداکثر امکانه یه‌کم دیرتر عوض بشه، ولی هیچ‌وقت زودتر.
function scheduleTransition(remainingSeconds) {
  clearTimeout(nextTrackTimer);
  const SAFETY_BUFFER_SECONDS = 1.5;
  nextTrackTimer = setTimeout(() => { checkAndTransition(); }, (remainingSeconds + SAFETY_BUFFER_SECONDS) * 1000);
}

// ---------- صدای بینِ‌آهنگی: بعدِ پایانِ هر آهنگ پخش می‌شه، بعدش با موقعیتِ واقعیِ سرور sync می‌شیم ----------
let cachedJingleNames = null;
async function playJingle() {
  try {
    if (!cachedJingleNames) {
      const res = await fetchWithRetry(`${WORKER_URL}/api/radio/jingle/list`);
      const data = await res.json();
      cachedJingleNames = (data && data.files) || [];
    }
    if (!cachedJingleNames.length) return;
    const pick = cachedJingleNames[Math.floor(Math.random() * cachedJingleNames.length)];
    jingleAudio.src = jingleUrl(pick);
    jingleAudio.volume = 1;
    await new Promise((resolve) => {
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      jingleAudio.addEventListener("ended", finish, { once: true });
      jingleAudio.addEventListener("error", finish, { once: true });
      setTimeout(finish, 8000); // سقفِ ایمنی، اگه جینگل لود/پخش نشد گیر نکنیم
      jingleAudio.play().catch(finish);
    });
  } catch (e) {
    // جینگل نبود یا نشد؛ مهم نیست، رادیو باید ادامه پیدا کنه
  }
}

// شناسه‌ی یکتای هر «قسمت» (آهنگ/ویس/مکث)؛ چون مکث شناسه‌ی خودش رو نداره، startMsِ سرور (لحظه‌ی
// دقیقِ شروعِ همون قسمت) برای یکتاسازی کافیه — هر قسمتِ جدید startMsِ متفاوت داره.
function segmentKey(c) {
  return `${c.segmentType}:${c.postId || c.voiceId || "x"}:${c.startMs || 0}`;
}

// اعمالِ نتیجه‌ی /api/radio/now (چه در بارِ اول، چه resync، چه تعویضِ واقعیِ قسمت) رو خودِ audio
function applyTrackData(data, isForceTransition) {
  const c = data.current;
  const key = segmentKey(c);
  const isNewSegment = key !== currentSegmentKey || isForceTransition;

  if (isNewSegment) {
    currentSegmentKey = key;
    updateNowPlayingUi(data);
    if (c.segmentType === "pause") {
      // تو مکث چیزی پخش نمی‌شه؛ فقط سکوت تا قسمتِ بعدی
      try { audio.pause(); } catch (e) {}
    } else {
      audio.src = mediaUrl(c.fileId);
      // بدونِ فیدِ ورودی: کراس‌فید فقط مالِ پایانِ آهنگه، نه شروعِ هیچ قسمتی — پس همیشه از همون
      // لحظه‌ی اول با صدای کامل شروع می‌شه
      audio.volume = 1;
      audio.addEventListener(
        "loadedmetadata",
        () => { try { audio.currentTime = c.offsetSeconds; } catch (e) {} },
        { once: true }
      );
      if (started) {
        audio.play().catch(() => {});
      }
    }
  } else if (c.segmentType !== "pause") {
    audio.volume = 1;
    const drift = Math.abs(audio.currentTime - c.offsetSeconds);
    if (drift > 4) {
      try { audio.currentTime = c.offsetSeconds; } catch (e) {}
    }
  }

  scheduleTransition(c.remainingSeconds);
  scheduleNextUpPreview(c.remainingSeconds, data.next);
  // کراس‌فیدِ ۱۰ثانیه‌ای فقط برای پایانِ «آهنگ» معنی داره؛ ویس/مکث کوتاه‌ترن و فیدِ تدریجی لازم ندارن
  if (c.segmentType === "song") {
    scheduleCrossfadeOut(c.remainingSeconds);
  } else {
    clearTimeout(crossfadeOutTimer);
  }
}

// وقتِ زمان‌بندی‌شده‌ی تعویض می‌رسه؛ اول از سرور تاییدِ واقعی می‌گیریم، نه اینکه کورکورانه قطع کنیم
async function checkAndTransition() {
  try {
    const data = await fetchRadioNow();
    if (segmentKey(data.current) === currentSegmentKey) {
      // زودتر از موقع بوده (یا سرور هنوز همون قسمت رو معتبر می‌دونه)؛ فقط دوباره زمان‌بندی کن، هیچی قطع نشه
      applyTrackData(data, false);
      setStatus("");
      return;
    }
    inJingleTransition = true;
    clearTimeout(crossfadeOutTimer);
    try {
      nextUpBox.classList.remove("visible");
      // تا اینجا معمولاً کراس‌فیدِ ۱۰ثانیه‌ایِ پایانِ آهنگ (scheduleCrossfadeOut) خودش صدا رو به صفر
      // رسونده؛ این فقط یه سقفِ ایمنیِ سریعه برای وقتی resync دیرتر از موعد رسیده و صدا هنوز کامل نرسیده صفر.
      if (!audio.paused && audio.volume > 0.02) await fadeVolume(audio, audio.volume, 0, 300);
      audio.pause();
      // جینگل فقط قبلِ شروعِ یه «آهنگِ» جدید پخش می‌شه؛ رفتن به سمتِ ویس یا مکث بدونِ جینگله، چون
      // اونا کوتاه و بی‌واسطه‌ان و جینگل قبلِ‌شون فقط پخشِ رادیو رو کش می‌ده
      if (data.current.segmentType === "song") {
        await playJingle();
      }
    } finally {
      inJingleTransition = false;
      applyTrackData(data, true);
      setStatus("");
    }
  } catch (e) {
    setStatus("اتصال به رادیو برقرار نشد، دوباره امتحان می‌کنیم...", true);
    nextTrackTimer = setTimeout(checkAndTransition, 4000);
  }
}

async function syncToServer(isTrackTransition) {
  try {
    const data = await fetchRadioNow();
    applyTrackData(data, isTrackTransition);
    setStatus("");
  } catch (e) {
    setStatus("اتصال به رادیو برقرار نشد، دوباره امتحان می‌کنیم...", true);
    setTimeout(() => syncToServer(false), 4000);
  }
}

function tickProgress() {
  if (!currentDuration || inJingleTransition) return;
  const elapsed = Math.min(currentDuration, audio.currentTime || 0);
  nowProgressFill.style.width = `${(elapsed / currentDuration) * 100}%`;
}

audio.addEventListener("play", () => setLive(true));
audio.addEventListener("pause", () => { if (!inJingleTransition) setLive(false); });

progressTimer = setInterval(tickProgress, 500);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && started) syncToServer(true);
});

// =========================================================================
// بخشِ ۲: چرخشِ پس‌زمینه‌ی تمام‌صفحه (عکس/ویدیوهای تیک‌خورده با «نمایش در رادیو دهات»)
// کاملاً مستقل از زمان‌بندیِ صوتی؛ هر ۴۵ ثانیه (طبقِ پاسخِ سرور) عوض می‌شه.
// =========================================================================
const bgLayerA = document.getElementById("bgLayerA");
const bgLayerB = document.getElementById("bgLayerB");
const bgVideoA = document.getElementById("radioBgVideoA");
const bgVideoB = document.getElementById("radioBgVideoB");
let bgActiveIsA = true;
let bgTimer = null;
let bgCurrentPostId = null;

async function fetchRadioVisualNow() {
  const res = await fetchWithRetry(`${WORKER_URL}/api/radio/visual-now`, {
    headers: { Authorization: `Bearer ${getToken()}` },
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "پس‌زمینه در دسترس نیست");
  return data;
}

function showVisual(item) {
  const showingLayer = bgActiveIsA ? bgLayerB : bgLayerA;
  const hidingLayer = bgActiveIsA ? bgLayerA : bgLayerB;
  const showingVideo = bgActiveIsA ? bgVideoB : bgVideoA;
  const hidingVideo = bgActiveIsA ? bgVideoA : bgVideoB;

  showingLayer.innerHTML = "";
  if (item.type === "video") {
    showingVideo.src = mediaUrl(item.fileId);
    showingVideo.muted = true;
    showingVideo.style.display = "block";
    showingVideo.play().catch(() => {});
    showingLayer.appendChild(showingVideo);
  } else {
    const img = document.createElement("img");
    img.src = mediaUrl(item.fileId);
    img.alt = "";
    showingLayer.appendChild(img);
  }

  showingLayer.classList.add("visible");
  hidingLayer.classList.remove("visible");
  if (hidingVideo) { try { hidingVideo.pause(); } catch (e) {} }
  bgActiveIsA = !bgActiveIsA;
}

function scheduleNextVisual(remainingSeconds) {
  clearTimeout(bgTimer);
  bgTimer = setTimeout(() => { syncVisual(); }, Math.max(1, remainingSeconds) * 1000);
}

async function syncVisual() {
  try {
    const data = await fetchRadioVisualNow();
    bgEmptyNote.style.display = "none";
    const c = data.current;
    if (c.postId !== bgCurrentPostId) {
      bgCurrentPostId = c.postId;
      showVisual(c);
    }
    scheduleNextVisual(data.remainingSeconds);
  } catch (e) {
    bgEmptyNote.style.display = "flex";
    setTimeout(syncVisual, 15000);
  }
}

// =========================================================================
// بخشِ ۳: ضبط و ارسالِ ویس به صفِ رادیو — حداکثر ۲۰ ثانیه؛ یه‌بار لمس برای شروع، یه‌بار دیگه
// برای توقفِ زودتر (یا خودش سرِ ۲۰ ثانیه قطع می‌شه). بعدِ ارسال، فقط «نفرِ چندم تو صف»ه رو می‌دونیم.
// =========================================================================
const voiceRecordBtn = document.getElementById("voiceRecordBtn");
const voiceStatus = document.getElementById("voiceStatus");
const VOICE_MAX_SECONDS = 20;
let mediaRecorder = null;
let recordChunks = [];
let recordStream = null;
let recordStartTime = 0;
let recordAutoStopTimer = null;
let isRecording = false;
let isUploadingVoice = false;

function setVoiceStatus(text, isError) {
  voiceStatus.textContent = text || "";
  voiceStatus.classList.toggle("visible", !!text);
  voiceStatus.classList.toggle("error", !!isError);
}

async function startVoiceRecording() {
  if (isRecording || isUploadingVoice) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    setVoiceStatus("مرورگرت از ضبطِ صدا پشتیبانی نمی‌کنه", true);
    setTimeout(() => setVoiceStatus(""), 3000);
    return;
  }
  try {
    recordStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setVoiceStatus("اجازه‌ی دسترسی به میکروفون داده نشد", true);
    setTimeout(() => setVoiceStatus(""), 3000);
    return;
  }
  recordChunks = [];
  const mimeCandidates = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/webm"];
  const mimeType = mimeCandidates.find((m) => window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
  try {
    mediaRecorder = mimeType ? new MediaRecorder(recordStream, { mimeType }) : new MediaRecorder(recordStream);
  } catch (e) {
    mediaRecorder = new MediaRecorder(recordStream);
  }
  mediaRecorder.addEventListener("dataavailable", (e) => { if (e.data && e.data.size > 0) recordChunks.push(e.data); });
  mediaRecorder.addEventListener("stop", onVoiceRecordingStopped);
  mediaRecorder.start();
  isRecording = true;
  recordStartTime = Date.now();
  voiceRecordBtn.classList.add("recording");
  setVoiceStatus("در حالِ ضبط... (حداکثر ۲۰ ثانیه)");
  recordAutoStopTimer = setTimeout(() => stopVoiceRecording(), VOICE_MAX_SECONDS * 1000);
}

function stopVoiceRecording() {
  if (!isRecording || !mediaRecorder) return;
  clearTimeout(recordAutoStopTimer);
  isRecording = false;
  voiceRecordBtn.classList.remove("recording");
  try { mediaRecorder.stop(); } catch (e) {}
  if (recordStream) {
    recordStream.getTracks().forEach((t) => t.stop());
    recordStream = null;
  }
}

async function onVoiceRecordingStopped() {
  const durationSeconds = Math.min(VOICE_MAX_SECONDS, Math.round((Date.now() - recordStartTime) / 1000));
  const chunks = recordChunks;
  recordChunks = [];
  if (durationSeconds < 1 || chunks.length === 0) {
    setVoiceStatus("ویس خیلی کوتاه بود، دوباره امتحان کن", true);
    setTimeout(() => setVoiceStatus(""), 2500);
    return;
  }
  const blob = new Blob(chunks, { type: (mediaRecorder && mediaRecorder.mimeType) || "audio/webm" });
  isUploadingVoice = true;
  setVoiceStatus("در حالِ ارسال...");
  try {
    const fd = new FormData();
    fd.append("file", blob, "voice.webm");
    fd.append("duration", String(durationSeconds));
    const res = await fetch(`${WORKER_URL}/api/radio/voice`, {
      method: "POST",
      headers: { Authorization: `Bearer ${getToken()}` },
      body: fd,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "ارسال ناموفق بود");
    setVoiceStatus(`تو صف قرار گرفتی — نفرِ ${toPersianDigits(data.position)}اُم`);
    setTimeout(() => setVoiceStatus(""), 6000);
  } catch (e) {
    setVoiceStatus(e.message || "ارسالِ ویس ناموفق بود", true);
    setTimeout(() => setVoiceStatus(""), 4000);
  } finally {
    isUploadingVoice = false;
  }
}

voiceRecordBtn.addEventListener("click", () => {
  if (isRecording) stopVoiceRecording();
  else startVoiceRecording();
});

// =========================================================================
// شروع: یه ژستِ کاربریِ یک‌بارمصرف (برای مجوزِ خودکارپخشِ صدا)؛ بعدش دیگه هیچ کنترلی دستِ کاربر نیست
// =========================================================================
enterBtn.addEventListener("click", async () => {
  if (started) return;
  started = true;
  enterOverlay.classList.add("hidden-overlay");
  setStatus("در حال اتصال به رادیو...");
  audio.muted = false;
  voiceRecordBtn.style.display = "flex";
  syncVisual();
  await syncToServer(true);
});
</script>

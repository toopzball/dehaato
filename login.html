<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script>
// تشخیصِ زودهنگام (قبل از رندرِ استایل) که داخلِ اپِ اندرویدیم یا مرورگرِ معمولی؛ کاتلین این
// رشته رو به User-Agent اضافه می‌کنه. فقط داخلِ اپ، کلاسِ in-kiosk-app رو به html اضافه می‌کنیم
// تا افکتِ بلورِ پس‌زمینه سبک‌تر/سریع‌تر بشه؛ تو مرورگر هیچ فرقی نمی‌کنه.
try {
  if (navigator.userAgent.indexOf("DehaatKioskApp") !== -1) {
    document.documentElement.classList.add("in-kiosk-app");
  }
} catch (e) {}
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>دهات</title>
<link rel="icon" type="image/png" href="favicon-dark.png" media="(prefers-color-scheme: light)" />
<link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: dark)" />
<style>
  /* فونت وزیرمتن حالا از همون دامنه‌ی خودمون سرو می‌شه (نه fonts.googleapis.com/fonts.gstatic.com)؛
     یعنی نه DNS/TLS جداگونه لازمه و نه وابسته به سرعتِ گوگل از داخلِ ایرانه.
     فایل‌های woff2 باید تو مسیرِ /fonts/ همین پروژه (کنارِ index.html) قرار بگیرن. */
  @font-face {
    font-family: 'Vazirmatn';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/Vazirmatn-Regular.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Vazirmatn';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('/fonts/Vazirmatn-Medium.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Vazirmatn';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('/fonts/Vazirmatn-Bold.woff2') format('woff2');
  }
  :root {
    --primary: #1A0A31;
    --surface: #241243;
    --card: #2D1856;
    --accent: #8B5CF6;
    --accent-hover: #A78BFA;
    --text: #FFFFFF;
    --subtext: #C9C4D8;
    --border: #3D2A64;
    --success: #22C55E;
    --error: #EF4444;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
    background: var(--primary);
  }
  /* پس‌زمینه‌ی ویدیویی: main/Bg.mp4 — به‌جای حباب‌های CSS. ویدیو تمامِ صفحه رو با object-fit:cover
     پر می‌کنه و یه لایه‌ی تیره روش هست تا متن/فرمِ روش خونا بمونه */
  .bg-anim { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--primary); contain: strict; }
  .bg-video {
    position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
    width: auto; height: auto; transform: translate(-50%, -50%); object-fit: cover;
  }
  .bg-video-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 10, 15, 0.55), rgba(10, 10, 15, 0.78)); }
  @media (prefers-reduced-motion: reduce) {
    .bg-video { display: none; } /* به‌جاش رنگِ ثابتِ var(--primary) که رویِ .bg-anim هست دیده می‌شه */
  }
  .box { width: 100%; max-width: 380px; position: relative; z-index: 1; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes shake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); } 30%, 50%, 70% { transform: translateX(-4px); } 40%, 60% { transform: translateX(4px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulseDot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  .brand { text-align: center; margin-bottom: 24px; animation: fadeInUp 0.6s ease both; }
  /* به‌جای عکسِ ثابتِ قبلی، همون نشانِ متحرکِ ترکیب‌های «: » و «D» که تو اسپلش‌اسکرینِ اصلیِ اپ هم هست */
  .app-splash-emoji.brand-emoji {
    direction: ltr; font-size: 46px; font-weight: 800; letter-spacing: 1px; color: var(--text);
    font-variant-numeric: tabular-nums;
    min-height: 60px; width: 80px; margin-inline: auto;
    display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
    animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both, float 4s ease-in-out 0.6s infinite;
  }
  .app-splash-emoji.brand-emoji .splash-caret {
    display: inline-block; width: 3px; height: 36px; background: var(--accent-hover);
    margin-inline-start: 3px; animation: caretBlink 0.9s step-end infinite;
  }
  .brand h1 { font-size: 26px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.02em; }
  .brand p { font-size: 13px; color: var(--subtext); margin: 0; }
  #subtitleWord { color: var(--accent-hover); font-weight: 500; }
  .subtitle-caret {
    display: inline-block; width: 1px; height: 12px; background: var(--accent-hover);
    margin-inline-start: 2px; vertical-align: -1px; animation: caretBlink 0.9s step-end infinite;
  }
  @keyframes caretBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .subtitle-caret { animation: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand, .app-splash-emoji, .card, .captcha-wrap { animation: none !important; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    animation: fadeInUp 0.6s ease 0.1s both;
    transition: box-shadow 0.3s ease;
  }

  .tabs { display: flex; gap: 4px; background: var(--primary); border-radius: 10px; padding: 4px; margin-bottom: 18px; }
  .tabs button {
    flex: 1; padding: 9px; border: none; border-radius: 8px; background: transparent;
    font-family: inherit; font-size: 14px; color: var(--subtext); cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease;
  }
  .tabs button.active { background: var(--card); color: var(--text); font-weight: 500; animation: popIn 0.3s ease both; }
  .tabs button:active { transform: scale(0.95); }

  input {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; margin-bottom: 10px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
  }
  input::placeholder { color: var(--subtext); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25); transform: translateY(-1px); }

  /* ---------- باکسِ فیلدِ رمز + دکمه‌ی چشمِ نمایش/مخفی‌کردنِ رمز ---------- */
  .password-field { position: relative; }
  .password-field input { padding-left: 42px; margin-bottom: 0; }
  .password-toggle-btn {
    position: absolute; top: 50%; left: 6px; transform: translateY(-50%);
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    background: none; border: none; border-radius: 8px; cursor: pointer; color: var(--subtext);
    transition: color 0.2s ease, background 0.2s ease;
  }
  .password-toggle-btn:hover { color: var(--text); background: var(--surface); }
  .password-toggle-btn svg { width: 19px; height: 19px; }
  .password-toggle-btn .eye-off-icon { display: none; }
  .password-toggle-btn.revealed .eye-icon { display: none; }
  .password-toggle-btn.revealed .eye-off-icon { display: block; }
  .password-field-spacer { margin-bottom: 10px; }

  #formStage { display: grid; }
  #formStage > div { grid-area: 1 / 1; min-width: 0; }
  #loginForm, #registerForm { animation: fadeIn 0.35s ease both; transition: opacity 0.2s ease; }
  .form-hide { visibility: hidden; pointer-events: none; opacity: 0; }

  button.primary {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-family: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    position: relative;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 6px 18px rgba(139, 92, 246, 0.35); transform: translateY(-1px); }
  button.primary:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  button.primary:disabled { opacity: 0.7; cursor: default; }
  button.primary.loading { color: transparent; }
  button.primary.loading::after {
    content: ""; position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
    margin: -8px 0 0 -8px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }

  .error { color: var(--error); font-size: 13px; margin-top: 8px; min-height: 16px; }
  .error.shake { animation: shake 0.4s ease; }
  .hint { color: var(--success); font-size: 13px; margin-top: 8px; min-height: 16px; }
  .hint:not(:empty) { animation: fadeInUp 0.3s ease both; }
  .hidden { display: none !important; }

  /* ---------- کلیک روی تیکِ تایید یه پاپ‌آپِ ۳مرحله‌ای باز می‌کنه: چیدنِ پازل، چرخوندنِ نوشابه،
     و یه سوالِ متنی. تشخیصِ واقعیِ بات/غیربات کاملاً جدا و نامرئی، از همون لحظه‌ی لودِ صفحه تو
     پس‌زمینه اجرا می‌شه (همون اثبات‌کارِ SHA-256 قبلی)؛ این ۳ تست فقط یه چالشِ واقعیِ سمتِ کاربرن. */
  @keyframes captchaRingPulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45); } 100% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); } }
  @keyframes puzzlePieceShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  @keyframes puzzleSettle { 0% { transform: scale(1.15) rotate(-4deg); } 55% { transform: scale(0.94) rotate(2deg); } 100% { transform: scale(1) rotate(0deg); } }
  @keyframes rotateSuccessPulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 100% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } }

  .captcha-wrap { margin-bottom: 10px; animation: fadeIn 0.6s ease 0.2s both; }

  /* ---------- تیکِ تایید تو خودِ فرم (کلیک=بازکردنِ پاپ‌آپ) ---------- */
  .captcha-trigger {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; cursor: pointer; user-select: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .captcha-trigger:hover { border-color: var(--accent); }
  .captcha-trigger.verified { border-color: var(--success); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.16); cursor: default; animation: captchaRingPulse 0.7s ease-out; }
  .captcha-trigger-check {
    position: relative; flex: 0 0 24px; width: 24px; height: 24px; border-radius: 7px;
    border: 2px solid var(--border); background: var(--surface);
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .captcha-trigger.verified .captcha-trigger-check { border-color: var(--success); background: var(--success); }
  .captcha-trigger-check-icon {
    position: absolute; top: 50%; left: 50%; margin: -8px 0 0 -8px;
    width: 16px; height: 16px; opacity: 0; transform: scale(0.4) rotate(-20deg);
    transition: opacity 0.2s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .captcha-trigger.verified .captcha-trigger-check-icon { opacity: 1; transform: scale(1) rotate(0deg); }
  .captcha-trigger-check-spinner {
    position: absolute; top: 50%; left: 50%; margin: -8px 0 0 -8px;
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(139, 92, 246, 0.25); border-top-color: var(--accent);
    opacity: 0; transition: opacity 0.2s ease;
  }
  .captcha-trigger.solving .captcha-trigger-check-spinner { opacity: 1; animation: captchaSpin 0.8s linear infinite; }
  @keyframes captchaSpin { to { transform: rotate(360deg); } }
  .captcha-trigger-label { font-size: 14px; color: var(--text); flex: 1; }
  .captcha-trigger.verified .captcha-trigger-label { color: var(--success); }
  .captcha-badge {
    font-size: 10px; color: var(--subtext); opacity: 0.7; letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 4px; flex-shrink: 0;
  }
  .captcha-badge svg { width: 12px; height: 12px; opacity: 0.7; }

  /* ---------- پاپ‌آپ (شیرد، مشترکِ فرمِ ورود/ثبت‌نام) ---------- */
  .captcha-modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 6, 20, 0.65); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 999;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .captcha-modal-overlay.open { opacity: 1; pointer-events: auto; }
  .captcha-modal {
    width: 100%; max-width: 320px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; transform: scale(0.92) translateY(10px);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .captcha-modal-overlay.open .captcha-modal { transform: scale(1) translateY(0); }
  .captcha-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .captcha-modal-step-label { font-size: 11.5px; color: var(--subtext); }
  .captcha-modal-close {
    background: none; border: none; color: var(--subtext); font-size: 20px; line-height: 1;
    cursor: pointer; padding: 2px 6px; border-radius: 6px;
  }
  .captcha-modal-close:hover { color: var(--text); background: var(--surface); }
  .captcha-modal-step { display: none; }
  .captcha-modal-step.active { display: block; animation: fadeIn 0.25s ease; }

  /* مرحله‌ی ۱: چیدنِ پازل (همون قفسه) */
  .puzzle-scene {
    position: relative; height: 100px; border-radius: 8px; overflow: visible;
    background: linear-gradient(180deg, transparent 60%, rgba(139, 92, 246, 0.06) 60%);
    touch-action: none;
  }
  .puzzle-shelf-line { position: absolute; left: 4%; right: 4%; bottom: 28px; height: 2px; background: var(--border); border-radius: 2px; }
  .puzzle-filler, .puzzle-target, .puzzle-piece {
    position: absolute; bottom: 28px; width: 27px; height: 56px; margin-left: -13.5px;
  }
  .puzzle-filler, .puzzle-target { pointer-events: none; z-index: 1; }
  .puzzle-filler { opacity: 0.55; }
  .puzzle-filler svg, .puzzle-target svg { width: 100%; height: 100%; display: block; }
  .puzzle-piece {
    bottom: 4px; cursor: grab; user-select: none; touch-action: none; z-index: 2;
    transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
  }
  .puzzle-piece svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .puzzle-piece.dragging { cursor: grabbing; transition: none; z-index: 5; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.3)); }
  .puzzle-piece.shake { animation: puzzlePieceShake 0.4s ease; }
  .puzzle-piece.placed { bottom: 28px; cursor: default; pointer-events: none; animation: puzzleSettle 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .captcha-modal-hint { font-size: 12.5px; color: var(--subtext); text-align: center; margin: 10px 0 0; }

  /* مرحله‌ی ۲: چرخوندنِ نوشابه تا سرش طرفِ فلش قرار بگیره */
  .rotate-stage { position: relative; width: 150px; height: 150px; margin: 4px auto 0; touch-action: none; }
  .rotate-dial { position: absolute; inset: 0; border-radius: 50%; border: 2px dashed var(--border); }
  .rotate-dial.matched { border-color: var(--success); animation: rotateSuccessPulse 0.6s ease-out; }
  .rotate-target-arrow {
    position: absolute; top: 50%; left: 50%; width: 2px; height: 64px;
    background: var(--accent); transform-origin: bottom center; margin-left: -1px; margin-top: -64px; opacity: 0.6;
  }
  .rotate-target-arrow::after {
    content: ""; position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 9px solid var(--accent);
  }
  .rotate-bottle {
    position: absolute; top: 50%; left: 50%; width: 32px; height: 66px; margin: -33px 0 0 -16px;
    cursor: grab; touch-action: none; transform-origin: 50% 50%;
  }
  .rotate-bottle.dragging { cursor: grabbing; }
  .rotate-bottle svg { width: 100%; height: 100%; display: block; pointer-events: none; }

  /* مرحله‌ی ۳ (جدید): تکون دادنِ نوشابه تا کف کنه */
  .shake-stage {
    position: relative; height: 130px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; touch-action: none;
  }
  .shake-bottle {
    width: 40px; height: 82px; cursor: grab; touch-action: none; user-select: none;
  }
  .shake-bottle.dragging { cursor: grabbing; }
  .shake-bottle svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .shake-bottle.wobble-left { animation: shakeWobbleLeft 0.12s ease; }
  .shake-bottle.wobble-right { animation: shakeWobbleRight 0.12s ease; }
  .shake-bottle.popped { animation: shakePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .shake-progress-track {
    width: 70%; height: 8px; border-radius: 5px; background: var(--surface);
    border: 1px solid var(--border); overflow: hidden;
  }
  .shake-progress-fill { height: 100%; width: 0%; background: var(--success); border-radius: 5px; transition: width 0.18s ease; }
  @keyframes shakeWobbleLeft { 0% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } 100% { transform: rotate(0deg); } }
  @keyframes shakeWobbleRight { 0% { transform: rotate(0deg); } 50% { transform: rotate(16deg); } 100% { transform: rotate(0deg); } }
  @keyframes shakePop { 0% { transform: scale(1) rotate(0deg); } 30% { transform: scale(1.15) rotate(-6deg); } 60% { transform: scale(0.95) rotate(4deg); } 100% { transform: scale(1) rotate(0deg); } }

  /* مرحله‌ی ۴: سوالِ متنی */
  .question-stage { text-align: center; padding: 4px 0 0; }
  .question-text { font-size: 14px; color: var(--text); margin: 0 0 10px; white-space: pre-line; }
  #captchaAnswerInput { width: 100%; box-sizing: border-box; text-align: center; }
  #captchaAnswerSubmit { width: 100%; margin-top: 8px; }
  .question-error { color: var(--error); font-size: 12.5px; min-height: 16px; margin-top: 6px; }
  .question-error.shake { animation: shake 0.4s ease; }
  .captcha-modal-hint.subtle-hint { color: var(--accent); opacity: 0.9; margin: -2px 0 10px; }

  /* ---------- مرحله‌ی ۸: دکمه‌های آره/نه ---------- */
  .yesno-buttons { display: flex; gap: 12px; margin-top: 4px; }
  .yesno-btn {
    flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-family: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  .yesno-btn:active { transform: scale(0.96); }
  .yesno-yes:hover { background: var(--success); border-color: var(--success); color: #fff; }
  .yesno-no:hover { background: #dc2626; border-color: #dc2626; color: #fff; }
  .yesno-unsure { text-align: center; margin: 12px 0 0; }
  .yesno-unsure.shake { animation: shake 0.4s ease; }

  @media (prefers-reduced-motion: reduce) {
    .captcha-trigger.verified, .puzzle-piece.placed, .puzzle-piece.shake, .rotate-dial.matched,
    .shake-bottle.wobble-left, .shake-bottle.wobble-right, .shake-bottle.popped,
    .captcha-trigger-check-spinner { animation: none !important; }
    .puzzle-piece { transition: none !important; }
  }

  .sound-toggle {
    position: fixed; top: 16px; left: 16px; width: 38px; height: 38px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border); color: var(--subtext);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    z-index: 2; transition: transform 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    animation: popIn 0.5s ease 0.3s both;
  }
  .sound-toggle:hover { transform: scale(1.08) rotate(-6deg); color: var(--accent-hover); border-color: var(--accent); }
  .sound-toggle:active { transform: scale(0.94); }
  .sound-toggle svg { width: 17px; height: 17px; transition: transform 0.2s ease; }
  .sound-toggle .icon-muted { display: none; }
  .sound-toggle.muted .icon-on { display: none; }
  .sound-toggle.muted .icon-muted { display: block; }
  /* --- اسپلش ویدیویی قبل از ورود --- */
  .splash-overlay {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 9999;
    width: 100%; height: 100%;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: opacity 0.6s ease;
  }
  .splash-overlay.fade-out { opacity: 0; pointer-events: none; }
  .splash-overlay video {
    max-width: 100%; max-height: 100%;
    width: 100%; height: 100%;
    min-width: 0; min-height: 0;
    object-fit: contain; object-position: center;
    display: block;
    /* تا وقتی اولین فریمِ واقعی ویدیو آماده نشده، مخفیه (به‌جای کاورِ خاکستریِ پیش‌فرضی که خودِ
       المانِ ویدیو قبل از لودشدن نشون می‌ده)؛ پس‌زمینه‌ی مشکیِ خودِ splash-overlay به‌جاش دیده می‌شه. */
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .splash-overlay video.video-ready { opacity: 1; }
  body.splash-active { overflow: hidden; }

  /* --- صفحه‌ی «در ورودی» قبل از اسپلش: با کلیک روی این، هم درِ SVG باز می‌شه هم
     چون همون لحظه یه user-gesture واقعیه، ویدیوی اسپلش می‌تونه با صدا پلی بشه --- */
  .door-gate {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10000;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    cursor: pointer; text-align: center; padding: 20px;
    transition: none;
  }
  .door-gate.hide { opacity: 0; pointer-events: none; }
  .door-gate-text {
    color: #fff; font-size: 16px; font-weight: 500; margin: 0;
    animation: fadeInUp 0.6s ease both;
    transition: opacity 0.3s ease;
  }
  .door-gate.opening .door-gate-text { opacity: 0; }
  .door-wrap {
    position: relative; width: min(46vw, 170px);
  }
  .door-gate.opening .door-wrap { animation: none; }
  @keyframes doorFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .door-svg {
    width: 100%; height: auto; overflow: visible; display: block;
    filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.25));
  }
  #doorLeaf {
    transition: transform 0.75s cubic-bezier(0.65, 0, 0.35, 1);
    transform-box: fill-box; transform-origin: left center;
  }
  .door-gate.opening #doorLeaf { transform: perspective(420px) rotateY(-100deg); }
</style>
</head>

<script>
// این اسکریپت عمداً بلافاصله بعد از خودِ در و اُوِرلی اومده، نه پایین فایل کنار بقیه‌ی اسکریپت‌ها،
// چون باید همون لحظه که این المان‌ها تو DOM ساخته می‌شن گوش‌سپاری‌شون شروع بشه؛ صفحه‌ی اصلی
// (فرم لاگین و بقیه‌ی المان‌ها) زیر این لایه‌ها در حال لود شدنه و کاربر چیزی جز در/ویدیو نمی‌بینه.
(function () {
  var gate = document.getElementById("doorGate");
  var overlay = document.getElementById("splashOverlay");
  var video = document.getElementById("splashVideo");
  if (!gate || !overlay || !video) return;
  var done = false;

  // ---------- انتخابِ تصادفیِ یکی از ویدیوهای mp4 و یکی از آهنگ‌های mp3 پوشه‌ی login ----------
  // به‌جای فایل‌های ثابت، هر بار یه ویدیو و یه آهنگ رو به‌صورت تصادفی انتخاب می‌کنیم. برخلافِ قبل،
  // مرورگر اینجا با هیچ دامنه‌ی خارجی‌ای (نه api.github.com نه jsDelivr/raw.githubusercontent.com)
  // حرف نمی‌زنه؛ فقط با دامنه‌ی خودمون (/api/splash-media/...). خودِ ورکر (که سرور-به-سرور و از
  // داخلِ شبکه‌ی کلادفلر، نه از ایران، به گیت‌هاب وصل می‌شه) لیست و فایل‌ها رو می‌گیره و کش می‌کنه.
  // اگه این مرحله به هر دلیلی شکست بخوره (قطعیِ نت و...)، کاربر رو پشتِ صفحه‌ی سیاه نگه نمی‌داریم؛
  // مستقیم می‌ریم سراغِ فرمِ لاگین (بدون آهنگ).
  var mediaReadyPromise = fetch("/api/splash-media/list")
    .then(function (res) {
      if (!res.ok) throw new Error("splash media list error");
      return res.json();
    })
    .then(function (data) {
      var videos = data && Array.isArray(data.videos) ? data.videos : [];
      var audios = data && Array.isArray(data.audios) ? data.audios : [];

      if (audios.length) {
        var audioPick = audios[Math.floor(Math.random() * audios.length)];
        var bg = document.getElementById("bgMusic");
        if (bg) bg.src = "/api/splash-media/file/" + encodeURIComponent(audioPick);
      }

      if (!videos.length) throw new Error("no mp4 files found in login folder");
      var videoPick = videos[Math.floor(Math.random() * videos.length)];
      video.src = "/api/splash-media/file/" + encodeURIComponent(videoPick);
      video.load();
      return true;
    })
    .catch(function () {
      return false;
    });

  function finishSplash() {
    if (done) return;
    done = true;
    overlay.classList.add("fade-out");
    document.body.classList.remove("splash-active");
    setTimeout(function () {
      overlay.remove();
      // آهنگ لاگین عمداً همینجا و نه زودتر استارت می‌خوره، تا دقیقاً بعد از محو کامل شدن
      // اسپلش پخش بشه؛ تابع tryAutoplay پایین همین فایل (کنار المان bgMusic) تعریف شده و
      // چون یه function declaration معمولیه، تا این لحظه (که خیلی بعد از پارس کل صفحه‌ست) در دسترسه.
      if (typeof tryAutoplay === "function") tryAutoplay();
    }, 650);
  }
  video.addEventListener("ended", finishSplash);
  // فقط وقتی اولین فریمِ واقعیِ ویدیو آماده شد (نه زودتر) نمایشش بده؛ قبلِ اون، پس‌زمینه‌ی مشکیِ
  // splash-overlay دیده می‌شه، نه کاورِ خاکستریِ پیش‌فرضِ خودِ ویدیو.
  video.addEventListener("loadeddata", function () {
    video.classList.add("video-ready");
  });
  video.addEventListener("error", function () {
    // اگه ویدیو لود نشه (مثلاً مسیرش اشتباهه یا فایل رو ریپو نیست)، خطاش رو رو همون
    // نوار قرمز debugBanner (که پایین‌تر تو فایل تعریف شده) نشون بده تا رو موبایل هم دیده بشه
    var banner = document.getElementById("debugBanner");
    if (banner) {
      var code = video.error ? video.error.code : "?";
      banner.style.display = "block";
      banner.textContent = "خطای بارگذاری ویدیوی اسپلش (کد " + code + ") — مسیر: " + video.currentSrc;
    }
    finishSplash();
  });

  function playSplashVideo() {
    // اول باید مطمئن بشیم انتخابِ تصادفیِ ویدیو/آهنگ (بالای همین فایل) تموم شده و src ست شده؛
    // اگه اون مرحله شکست خورده باشه (ready=false)، دیگه صبر نمی‌کنیم و رد می‌شیم سراغِ لاگین.
    mediaReadyPromise.then(function (ready) {
      if (!ready) {
        finishSplash();
        return;
      }
      // نکته‌ی کلیدی: این تابع در نهایت از دلِ همون کلیک/تاچِ کاربر روی در صدا زده می‌شه (با یه
      // فاصله‌ی کوتاه)، پس هنوز تو بازه‌ی user-gesture معتبریم و مرورگر اجازه‌ی پخش صدادار می‌ده.
      video.muted = false;
      var p = video.play();
      if (p && p.catch) {
        p.catch(function () {
          // اگه به هر دلیلی بازم بلاک شد، حداقل بی‌صدا پلی بشه تا اسپلش گیر نکنه
          video.muted = true;
          video.play().catch(finishSplash);
        });
      }
      // شبکه‌ی ایمنی: اگه ایونت‌ها به هر دلیلی شلیک نشن، حداکثر بعد از طول ویدیو + کمی حاشیه رد شو
      setTimeout(finishSplash, 12000);
    });
  }

  function openDoor() {
    gate.removeEventListener("click", openDoor);
    gate.removeEventListener("keydown", onGateKeydown);
    gate.classList.add("opening");

    // همین‌جا، تو دلِ کلیک واقعی کاربر، آهنگِ پس‌زمینه رو (اگه تا این لحظه src گرفته باشه) یه بار
    // پلی و بلافاصله پاز می‌کنیم. این کار مرورگر رو مجاب می‌کنه این المان صوتی رو «تاییدشده با
    // ژست کاربر» علامت بزنه، پس هر وقت بعداً (حتی بدون ژست جدید) دوباره play() صداش کنیم، بدون
    // بلاک شدن با صدا پخش می‌شه. اگه هنوز src ست نشده باشه (fetch کند بوده)، خودِ tryAutoplay
    // بعداً با ژستِ بعدیِ کاربر (click/touchstart) دوباره تلاش می‌کنه، پس مشکلی پیش نمی‌آد.
    var bg = document.getElementById("bgMusic");
    if (bg && bg.src) {
      bg.muted = false;
      bg.play().then(function () { bg.pause(); bg.currentTime = 0; }).catch(function () {});
    }

    setTimeout(function () {
      gate.classList.add("hide");
      setTimeout(function () {
        gate.remove();
        // یک ثانیه بعد از محو کامل شدن در، ویدیو پلی می‌شه
        setTimeout(playSplashVideo, 1000);
      }, 550);
    }, 700);
  }
  function onGateKeydown(e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDoor(); }
  }
  gate.addEventListener("click", openDoor);
  gate.addEventListener("keydown", onGateKeydown);
})();
</script>

<script>
const WORKER_URL = "";

// خطاهای شبکه‌ای (قطعی/invalid response) خیلی وقتا لحظه‌ای و گذرا هستن؛ به‌جای این‌که فوراً
// خطا به کاربر نشون بدیم، یکی-دو بار خودکار (با یه مکثِ کوتاه) دوباره امتحان می‌کنیم.
// فقط وقتی fetch خودش قطع/ارور بشه ریترای می‌کنیم؛ جواب‌های معتبر با کدِ خطا (مثلاً رمزِ غلط) ریترای نمی‌شن.
async function fetchWithRetry(url, options, retries = 2, delayMs = 700) {
  for (let attempt = 0; ; attempt++) {
    try {
      return await fetch(url, options);
    } catch (e) {
      if (attempt >= retries) throw e;
      await new Promise((resolve) => setTimeout(resolve, delayMs));
    }
  }
}

// ================= شبکه: تلاش خودکار مجدد در صورت خطای اتصال =================
// بعضی از اینترنت‌ها (با یا بدون فیلترشکن) گاهی همون درخواست اولِ TCP/TLS رو با
// خطای شبکه (مثل "invalid response") قطع می‌کنن، در حالی که یه اتصال تازه معمولاً
// جواب می‌گیره. این wrapper به‌جای مجبور کردن کاربر به رفرش دستی یا خاموش‌روشن کردن
// فیلترشکن، خودش به‌صورت خودکار و بی‌صدا با یه اتصال تازه چند بار دیگه تلاش می‌کنه.
// نکته‌ی مهم: این کار فقط رو خطاهای واقعیِ اتصال (وقتی fetch اصلاً جوابی نگرفته)
// انجام می‌شه، نه رو جواب‌های معتبر سرور (مثل خطای 401/403/500)؛ یعنی هیچ منطق
// موجودِ if(!res.ok) توی بقیه‌ی کد دست نمی‌خوره و رفتارش عوض نمی‌شه.
(function () {
  const nativeFetch = window.fetch.bind(window);
  const MAX_RETRIES = 2;
  const RETRY_DELAY_MS = 700;
  const PER_ATTEMPT_TIMEOUT_MS = 15000;

  function delay(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  window.fetch = async function (input, init) {
    let lastErr;
    const externalSignal = init && init.signal;
    for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), PER_ATTEMPT_TIMEOUT_MS);
      if (externalSignal) {
        if (externalSignal.aborted) controller.abort();
        else externalSignal.addEventListener("abort", () => controller.abort(), { once: true });
      }
      try {
        const mergedInit = init ? { ...init, signal: controller.signal } : { signal: controller.signal };
        const res = await nativeFetch(input, mergedInit);
        clearTimeout(timeoutId);
        return res; // هر جوابی از سرور برگرده (حتی خطای 4xx/5xx) یعنی اتصال برقرار شده؛ دیگه retry لازم نیست
      } catch (err) {
        clearTimeout(timeoutId);
        lastErr = err;
        // اگه خودِ کد صداکننده درخواست رو کنسل کرده بود (نه ما با تایم‌اوت)، دیگه تلاش نکن
        if (externalSignal && externalSignal.aborted) throw err;
        if (attempt < MAX_RETRIES) {
          await delay(RETRY_DELAY_MS * (attempt + 1));
          continue;
        }
      }
    }
    throw lastErr;
  };
})();
// ---------- کپچای اثبات‌کار خودمیزبان (جایگزین Turnstile) ----------
// هیچ درخواستی به هیچ سرور خارجی نمی‌ره؛ چالش از همون WORKER_URL خودمون گرفته می‌شه و
// حلش هم کاملاً تو مرورگر خودِ کاربر با SubtleCrypto (SHA-256) انجام می‌شه.
//
// نکته‌ی مهم: خودِ پاپ‌آپ (هر ۳ تستش) هیچ ربطی به تشخیصِ بات نداره — صرفاً چالشی‌ست که خودِ کاربر
// باید درست انجامش بده. تشخیصِ واقعیِ بات به‌صورت کاملاً نامرئی و مستقل، همون لحظه‌ی لودِ صفحه
// (بدون نیاز به هیچ کلیکی)، تو پس‌زمینه شروع می‌شه. نتیجه‌ی نهایی (getSolution) فقط وقتی چیزی
// برمی‌گردونه که هم هر ۳ تست با موفقیت انجام شده باشن، هم اون محاسبه‌ی پس‌زمینه تموم شده باشه.

const PUZZLE_SLOT_POSITIONS = [15, 38, 62, 85];
const PUZZLE_FLOOR_POSITIONS = [18, 34, 50, 66, 82];
const PUZZLE_SNAP_TOLERANCE_PX = 30;
const ROTATE_DIRECTIONS_DEG = [0, 45, 90, 135, 180, 225, 270, 315];
const ROTATE_TOLERANCE_DEG = 22;
const SHAKE_REQUIRED_REVERSALS = 6; // چند بار باید جهتِ حرکت عوض بشه تا «تکون خوردن» حساب بشه
const SHAKE_MIN_DELTA_PX = 16; // حداقل جابه‌جاییِ افقی برای اینکه یه حرکت به‌حساب بیاد
const CAPTCHA_TOTAL_STEPS = 8; // تعدادِ کلِ مراحل (۳ مینی‌گیم + ۴ سوالِ متنی + ۱ آره/نه)

function toPersianDigits(n) {
  const map = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];
  return String(n).split("").map((d) => map[+d] || d).join("");
}

// ورودی‌های عددیِ فارسی/عربی و جداکننده‌ی اعشاریِ فارسی رو به یه float معمولی تبدیل می‌کنه؛
// اگه قابلِ‌تفسیر نبود null برمی‌گردونه
function parsePersianFloat(raw) {
  if (!raw) return null;
  const digitsMap = {
    "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4", "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9",
    "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4", "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9",
  };
  let s = raw.trim().replace(/[۰-۹٠-٩]/g, (d) => digitsMap[d] || d);
  s = s.replace(/[٫،]/g, ".").replace(/\s+/g, "");
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : null;
}

function normalizeCaptchaAnswer(s) {
  return (s || "").trim().toLowerCase().replace(/[\u200c\s]+/g, "");
}
const CAPTCHA_ACCEPTED_ANSWERS = ["عاقی", "آقی", "aghey", "زمزم", "zamzam"].map(normalizeCaptchaAnswer);
// جواب‌های «شوخی»ای که برای سوالِ انتگرال و فیزیک هم قبول می‌شن (کاربر می‌تونه به‌جایِ حل‌کردن، صادقانه بگه نمی‌دونه)
const CAPTCHA_JOKE_ANSWERS = ["نمیدونم", "چمیدونم", "idk", "چی"].map(normalizeCaptchaAnswer);
// جواب‌های قابل‌قبول برای سوالِ «تاریخ تولد» فقط تو حالتِ ورود (تو ثبت‌نام همین فیلد جای کدِ معرفه)
const CAPTCHA_BIRTHDATE_LOGIN_ANSWERS = ["به تو چه", "نمیدونم", "fuck you"].map(normalizeCaptchaAnswer);

// ---------- تعریفِ مراحلِ ۴ تا ۷ (همه از همون قالبِ HTML مشترکِ #captchaStepAnswer استفاده می‌کنن) ----------
// هر مرحله یه prompt (متنِ سوال)، یه subHint (توضیحِ کوچیکِ اختیاری، مثلاً فقط تو حالتِ ثبت‌نام) و
// یه check (تابعی که جوابِ خام رو می‌گیره و { ok, referralCode? } برمی‌گردونه) داره.
const CAPTCHA_ANSWER_STAGES = [
  {
    key: "owner",
    prompt: () => "اسمِ مالکِ سایت چیه؟",
    check: (norm) => ({ ok: CAPTCHA_ACCEPTED_ANSWERS.includes(norm) }),
  },
  {
    key: "integral",
    prompt: () => "انتگرالِ معینِ زیر رو حساب کن (با جزءبه‌جزء، دوبار):\n∫ از ۰ تا ۲ از x²·eˣ نسبت به x",
    check: (norm, raw) => {
      if (CAPTCHA_JOKE_ANSWERS.includes(norm)) return { ok: true };
      const val = parsePersianFloat(raw);
      const correct = 2 * Math.E * Math.E - 2; // = ۲e² − ۲ ≈ ۱۲.۷۷۸۱
      return { ok: val !== null && Math.abs(val - correct) < 0.02 };
    },
  },
  {
    key: "physics",
    prompt: () => "جرمِ خورشید تقریباً ۲×۱۰³۰ کیلوگرمه و شتابِ گرانش g=9.8 نیوتن‌بر‌کیلوگرمه؛ وزنِ علی (که ۷۰ کیلوگرمه) رو دقیقاً حساب کن",
    check: (norm, raw) => {
      if (CAPTCHA_JOKE_ANSWERS.includes(norm)) return { ok: true };
      const val = parsePersianFloat(raw);
      return { ok: val !== null && Math.abs(val - Math.PI) < 0.000002 };
    },
  },
  {
    key: "birthdate",
    prompt: () => "تاریخ تولدِ شما چندمه؟",
    subHint: (mode) => (mode === "register" ? "اگه داری ثبت‌نام می‌کنی: به‌جایِ جواب، کدِ معرفت رو همینجا بنویس" : ""),
    check: (norm, raw, mode) => {
      if (mode === "register") {
        const code = raw.trim();
        return code ? { ok: true, referralCode: code.toUpperCase() } : { ok: false };
      }
      return { ok: CAPTCHA_BIRTHDATE_LOGIN_ANSWERS.includes(norm) };
    },
  },
];

async function bufferToHex(buffer) {
  return [...new Uint8Array(buffer)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function leadingZeroBits(hexHash) {
  let bits = 0;
  for (const ch of hexHash) {
    const nibble = parseInt(ch, 16);
    if (nibble === 0) { bits += 4; continue; }
    bits += Math.clz32(nibble) - 28;
    break;
  }
  return bits;
}

// ============ پاپ‌آپِ مشترک (بینِ فرمِ ورود و ثبت‌نام؛ یکی کافیه) ============

// میزبانِ ۴ مرحله‌ی منطقیِ مختلفه (owner/integral/physics/birthdate) که پشتِ سرِ هم توش نمایش داده می‌شن
const captchaDomPanels = [captchaStepPuzzleEl, captchaStepRotateEl, captchaStepShakeEl, captchaStepAnswerEl, captchaStepYesNoEl];

let activeCaptchaController = null;

}

function openCaptchaModal(controller) {

const modalPuzzleScene = document.getElementById("modalPuzzleScene");
const modalPuzzleTarget = document.getElementById("modalPuzzleTarget");
const modalPuzzlePiece = document.getElementById("modalPuzzlePiece");
const modalPuzzleFillers = [0, 1, 2].map((i) => document.getElementById(`modalPuzzleFiller${i}`));

let puzzleDragging = false;
let puzzleDragStartX = 0, puzzleDragStartY = 0, puzzlePieceOrigLeftPx = 0, puzzlePieceOrigTopPx = 0;

function layoutModalPuzzle() {
  const targetIdx = Math.floor(Math.random() * PUZZLE_SLOT_POSITIONS.length);
  const fillerPositions = PUZZLE_SLOT_POSITIONS.filter((_, i) => i !== targetIdx);
  modalPuzzleTarget.style.left = PUZZLE_SLOT_POSITIONS[targetIdx] + "%";
  modalPuzzleFillers.forEach((el, i) => { el.style.left = fillerPositions[i] + "%"; });
  const startPos = PUZZLE_FLOOR_POSITIONS[Math.floor(Math.random() * PUZZLE_FLOOR_POSITIONS.length)];
  modalPuzzlePiece.style.left = startPos + "%";
  modalPuzzlePiece.style.top = "";
  modalPuzzlePiece.style.marginLeft = "";
  modalPuzzlePiece.classList.remove("placed", "dragging", "shake");
}

function attemptModalPlacement() {
  const pieceRect = modalPuzzlePiece.getBoundingClientRect();
  const targetRect = modalPuzzleTarget.getBoundingClientRect();
  const dist = Math.hypot(
    pieceRect.left + pieceRect.width / 2 - (targetRect.left + targetRect.width / 2),
    pieceRect.top + pieceRect.height / 2 - (targetRect.top + targetRect.height / 2)
  );
  if (dist <= PUZZLE_SNAP_TOLERANCE_PX) {
    const sceneRect = modalPuzzleScene.getBoundingClientRect();
    modalPuzzlePiece.style.left = (targetRect.left - sceneRect.left + targetRect.width / 2) + "px";
    modalPuzzlePiece.style.top = (targetRect.top - sceneRect.top) + "px";
    modalPuzzlePiece.style.marginLeft = "-13.5px";
    modalPuzzlePiece.classList.add("placed");
    captchaStageTransitionTimeout = setTimeout(() => { showCaptchaPanel(2); setCaptchaStepLabel(2); layoutRotateStep(); }, 500);
  } else {
    modalPuzzlePiece.style.left = puzzlePieceOrigLeftPx + "px";
    modalPuzzlePiece.style.top = puzzlePieceOrigTopPx + "px";
    modalPuzzlePiece.classList.add("shake");
    setTimeout(() => modalPuzzlePiece.classList.remove("shake"), 400);
  }
}

modalPuzzlePiece.addEventListener("pointerdown", (e) => {
  puzzleDragging = true;
  try { modalPuzzlePiece.setPointerCapture(e.pointerId); } catch (err) {}
  modalPuzzlePiece.classList.add("dragging");
  const pieceRect = modalPuzzlePiece.getBoundingClientRect();
  const sceneRect = modalPuzzleScene.getBoundingClientRect();
  puzzlePieceOrigLeftPx = pieceRect.left - sceneRect.left;
  puzzlePieceOrigTopPx = pieceRect.top - sceneRect.top;
  modalPuzzlePiece.style.left = puzzlePieceOrigLeftPx + "px";
  modalPuzzlePiece.style.top = puzzlePieceOrigTopPx + "px";
  modalPuzzlePiece.style.marginLeft = "0px";
  puzzleDragStartX = e.clientX;
  puzzleDragStartY = e.clientY;
  e.preventDefault();
});
modalPuzzlePiece.addEventListener("pointermove", (e) => {
  if (!puzzleDragging) return;
  const dx = e.clientX - puzzleDragStartX;
  const dy = e.clientY - puzzleDragStartY;
  modalPuzzlePiece.style.left = (puzzlePieceOrigLeftPx + dx) + "px";
  modalPuzzlePiece.style.top = (puzzlePieceOrigTopPx + dy) + "px";
});
function endPuzzleDrag() {
  if (!puzzleDragging) return;
  puzzleDragging = false;
  modalPuzzlePiece.classList.remove("dragging");
  attemptModalPlacement();
}
modalPuzzlePiece.addEventListener("pointerup", endPuzzleDrag);
modalPuzzlePiece.addEventListener("pointercancel", endPuzzleDrag);

// ---------- مرحله‌ی ۲: چرخوندنِ نوشابه تا سرش طرفِ فلش قرار بگیره ----------
const rotateDial = document.getElementById("rotateDial");
const rotateTargetArrow = document.getElementById("rotateTargetArrow");
const rotateBottle = document.getElementById("rotateBottle");
const rotateStage = document.getElementById("rotateStage");

let rotateTargetDeg = 0;
let rotateDragging = false;

function angleDiff(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

function layoutRotateStep() {
  rotateTargetDeg = ROTATE_DIRECTIONS_DEG[Math.floor(Math.random() * ROTATE_DIRECTIONS_DEG.length)];
  rotateTargetArrow.style.transform = `rotate(${rotateTargetDeg}deg)`;
  let startDeg;
  do { startDeg = Math.floor(Math.random() * 360); } while (angleDiff(startDeg, rotateTargetDeg) < 50);
  rotateBottle.style.transform = `rotate(${startDeg}deg)`;
  rotateDial.classList.remove("matched");
}

function angleFromCenter(clientX, clientY) {
  const rect = rotateStage.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const rad = Math.atan2(clientX - cx, -(clientY - cy)); // صفر درجه = بالا (شمال)، جهتِ عقربه‌ی ساعت مثبته
  let deg = (rad * 180) / Math.PI;
  if (deg < 0) deg += 360;
  return deg;
}

function currentBottleDeg() {
  const m = (rotateBottle.style.transform || "").match(/rotate\(([-\d.]+)deg\)/);
  return m ? parseFloat(m[1]) : 0;
}

rotateStage.addEventListener("pointerdown", (e) => {
  rotateDragging = true;
  try { rotateStage.setPointerCapture(e.pointerId); } catch (err) {}
  rotateBottle.classList.add("dragging");
  rotateBottle.style.transform = `rotate(${angleFromCenter(e.clientX, e.clientY)}deg)`;
  e.preventDefault();
});
rotateStage.addEventListener("pointermove", (e) => {
  if (!rotateDragging) return;
  rotateBottle.style.transform = `rotate(${angleFromCenter(e.clientX, e.clientY)}deg)`;
});
function endRotateDrag() {
  if (!rotateDragging) return;
  rotateDragging = false;
  rotateBottle.classList.remove("dragging");
  if (angleDiff(currentBottleDeg(), rotateTargetDeg) <= ROTATE_TOLERANCE_DEG) {
    rotateDial.classList.add("matched");
    captchaStageTransitionTimeout = setTimeout(() => { showCaptchaPanel(3); setCaptchaStepLabel(3); layoutShakeStep(); }, 500);
  }
}
rotateStage.addEventListener("pointerup", endRotateDrag);
rotateStage.addEventListener("pointercancel", endRotateDrag);

// ---------- مرحله‌ی ۳: نوشابه رو تکون بده تا کف کنه ----------
const shakeBottle = document.getElementById("shakeBottle");
const shakeProgressFill = document.getElementById("shakeProgressFill");

let shakeDragging = false;
let shakeLastX = 0;
let shakeDirection = 0; // -1 چپ، 1 راست، 0 هنوز شروع نشده
let shakeReversals = 0;
let shakeDone = false;

function layoutShakeStep() {
  shakeDragging = false;
  shakeDirection = 0;
  shakeReversals = 0;
  shakeDone = false;
  shakeProgressFill.style.width = "0%";
  shakeBottle.classList.remove("popped", "wobble-left", "wobble-right", "dragging");
}

shakeBottle.addEventListener("pointerdown", (e) => {
  if (shakeDone) return;
  shakeDragging = true;
  try { shakeBottle.setPointerCapture(e.pointerId); } catch (err) {}
  shakeBottle.classList.add("dragging");
  shakeLastX = e.clientX;
  e.preventDefault();
});
shakeBottle.addEventListener("pointermove", (e) => {
  if (!shakeDragging || shakeDone) return;
  const dx = e.clientX - shakeLastX;
  if (Math.abs(dx) < SHAKE_MIN_DELTA_PX) return;
  const dir = dx > 0 ? 1 : -1;
  shakeLastX = e.clientX;
  if (shakeDirection !== 0 && dir !== shakeDirection) {
    shakeReversals++;
    shakeBottle.classList.remove("wobble-left", "wobble-right");
    void shakeBottle.offsetWidth; // ری‌استارتِ انیمیشن
    shakeBottle.classList.add(dir > 0 ? "wobble-right" : "wobble-left");
    const pct = Math.min(100, Math.round((shakeReversals / SHAKE_REQUIRED_REVERSALS) * 100));
    shakeProgressFill.style.width = pct + "%";
    if (shakeReversals >= SHAKE_REQUIRED_REVERSALS) {
      shakeDone = true;
      shakeBottle.classList.add("popped");
      captchaStageTransitionTimeout = setTimeout(() => { showCaptchaPanel(4); setCaptchaStepLabel(4); layoutAnswerStage(0); }, 550);
    }
  }
  shakeDirection = dir;
});
function endShakeDrag() {
  shakeDragging = false;
  shakeBottle.classList.remove("dragging");
}
shakeBottle.addEventListener("pointerup", endShakeDrag);
shakeBottle.addEventListener("pointercancel", endShakeDrag);

// ---------- مرحله‌های ۴ تا ۷: سوال‌های متنی (اسمِ مالک، انتگرال، فیزیک، تاریخ‌تولد/کدِ معرف) ----------
const captchaAnswerPrompt = document.getElementById("captchaAnswerPrompt");
const captchaAnswerSubHint = document.getElementById("captchaAnswerSubHint");
const captchaAnswerInput = document.getElementById("captchaAnswerInput");
const captchaAnswerSubmit = document.getElementById("captchaAnswerSubmit");
const captchaAnswerError = document.getElementById("captchaAnswerError");

let currentAnswerStageIndex = 0;

function layoutAnswerStage(stageIndex) {
  currentAnswerStageIndex = stageIndex;
  const stage = CAPTCHA_ANSWER_STAGES[stageIndex];
  const mode = activeCaptchaController ? activeCaptchaController.mode : "login";
  captchaAnswerPrompt.textContent = stage.prompt(mode);
  const hintText = stage.subHint ? stage.subHint(mode) : "";
  captchaAnswerSubHint.textContent = hintText;
  captchaAnswerSubHint.classList.toggle("hidden", !hintText);
  captchaAnswerInput.value = "";
  captchaAnswerError.textContent = "";
  captchaAnswerError.classList.remove("shake");
  setTimeout(() => captchaAnswerInput.focus(), 50);
}

function submitCaptchaAnswer() {
  const raw = captchaAnswerInput.value;
  if (!raw.trim()) return;
  const norm = normalizeCaptchaAnswer(raw);
  const mode = activeCaptchaController ? activeCaptchaController.mode : "login";
  const stage = CAPTCHA_ANSWER_STAGES[currentAnswerStageIndex];
  const result = stage.check(norm, raw, mode) || { ok: false };

  if (result.ok) {
    if (result.referralCode && activeCaptchaController && activeCaptchaController.setReferralCode) {
      activeCaptchaController.setReferralCode(result.referralCode);
    }
    if (currentAnswerStageIndex + 1 < CAPTCHA_ANSWER_STAGES.length) {
      const nextIndex = currentAnswerStageIndex + 1;
      setCaptchaStepLabel(4 + nextIndex);
      layoutAnswerStage(nextIndex);
    } else {
      showCaptchaPanel(5);
      setCaptchaStepLabel(8);
      layoutYesNoStep();
    }
  } else {
    captchaAnswerError.textContent = "جواب درست نیست، دوباره امتحان کن";
    captchaAnswerError.classList.remove("shake");
    void captchaAnswerError.offsetWidth;
    captchaAnswerError.classList.add("shake");
    captchaAnswerInput.select();
  }
}
captchaAnswerSubmit.addEventListener("click", submitCaptchaAnswer);
captchaAnswerInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitCaptchaAnswer(); });

// ============ کنترلرِ هر فرم (ورود/ثبت‌نام): تریگر باکس + تشخیصِ نامرئیِ پس‌زمینه ============
function createCaptchaController(suffix, mode) {
  const trigger = document.getElementById(`captchaTrigger${suffix}`);
  const label = document.getElementById(`captchaTriggerLabel${suffix}`);
  const defaultLabelText = label.textContent;

  let backgroundSolution = null; // { id, nonce } — نتیجه‌ی نامرئیِ اثبات‌کار، مستقل از پاپ‌آپ
  let backgroundSolving = false;
  let solved = false;
  let userInteracted = false; // تا کاربر روی جعبه کلیک نکرده، اسپینر نباید نشون داده بشه (حتی اگه حلِ نامرئی از قبل شروع شده باشه)
  let referralCodeValue = null; // فقط برای mode="register" پر می‌شه (تویِ مرحله‌ی تاریخ‌تولد/کدِ معرف)

  // اسپینرِ رویِ جعبه رو فقط وقتی نشون بده که هم واقعاً درحالِ حل‌شدنه و هم کاربر حداقل یه‌بار کلیک کرده
  function updateSolvingIndicator() {
    trigger.classList.toggle("solving", backgroundSolving && userInteracted && !solved);
  }

  async function solveBackground() {
    if (backgroundSolving || backgroundSolution) return;
    backgroundSolving = true;
    updateSolvingIndicator();
    try {
      const res = await fetchWithRetry(`${WORKER_URL}/api/captcha/challenge`, { method: "POST" });
      if (!res.ok) throw new Error("challenge request failed");
      const { id, salt, difficulty } = await res.json();
      let nonce = 0;
      const enc = new TextEncoder();
      while (true) {
        const hashBuf = await crypto.subtle.digest("SHA-256", enc.encode(`${salt}:${nonce}`));
        const hex = await bufferToHex(hashBuf);
        if (leadingZeroBits(hex) >= difficulty) break;
        nonce++;
        if (nonce % 400 === 0) await new Promise((r) => setTimeout(r, 0));
      }
      backgroundSolution = { id, nonce };
      updateUi();
    } catch (e) {
      backgroundSolution = null;
      setTimeout(() => { backgroundSolving = false; solveBackground(); }, 2500);
      return;
    } finally {
      backgroundSolving = false;
      updateSolvingIndicator();
    }
  }

  function updateUi() {
    if (solved && backgroundSolution) {
      trigger.classList.add("verified");
      label.textContent = "تایید شد";
    }
    updateSolvingIndicator();
  }

  function markSolved() {
    solved = true;
    updateUi();
  }

  function reset() {
    backgroundSolution = null;
    backgroundSolving = false;
    solved = false;
    userInteracted = false;
    referralCodeValue = null;
    trigger.classList.remove("verified", "solving");
    label.textContent = defaultLabelText;
    solveBackground();
  }

  trigger.addEventListener("click", () => {
    if (solved) return;
    userInteracted = true;
    updateSolvingIndicator();
    openCaptchaModal({ markSolved, mode, setReferralCode: (c) => { referralCodeValue = c; } });
  });
  trigger.addEventListener("keydown", (e) => {
    if (!solved && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      userInteracted = true;
      updateSolvingIndicator();
      openCaptchaModal({ markSolved, mode, setReferralCode: (c) => { referralCodeValue = c; } });
    }
  });

  solveBackground(); // از همون لحظه‌ی لود، بدون نیاز به هیچ کلیکی، تو پس‌زمینه شروع می‌شه

  return {
    mode,
    getSolution: () => (solved && backgroundSolution ? backgroundSolution : null),
    getReferralCode: () => referralCodeValue,
    reset,
  };
}

const captchaControllers = {
  login: createCaptchaController("Login", "login"),
  register: createCaptchaController("Register", "register"),
};

// ---------- نمایش هر خطای جاوااسکریپت روی صفحه (چون رو موبایل به کنسول دسترسی نیست) ----------

window.addEventListener("unhandledrejection", function (e) {
  const banner = document.getElementById("debugBanner");
  banner.style.display = "block";
  banner.textContent = "خطای Promise: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
});

// ---------- نشانِ متحرکِ ترکیب‌های «:» و «D» (لوگوی صفحه‌ی لاگین): همون افکتِ تایپِ اسپلش‌اسکرینِ اصلیِ اپ ----------
(function initBrandEmoji() {
  // کاراکتر دوم همیشه از این لیست انتخاب می‌شه؛ چون "3" چندبار تکرار شده، شانس بیشتری برای اومدن داره
  const SECOND_CHARS = ["D", "O", ")", "(", "#", "3", "3"];
  const host = document.querySelector("#brandEmoji .emoji-text");
  if (!host) return;

  function pickCombo() {
    const second = SECOND_CHARS[Math.floor(Math.random() * SECOND_CHARS.length)];
    return ":" + second; // همیشه دقیقاً ۲ کاراکتر؛ اولی همیشه ":" است
  }

  let combo = pickCombo();
  let charIndex = 0;
  let phase = "typing";

  function tick() {
    if (document.hidden) { setTimeout(tick, 400); return; }

    if (phase === "typing") {
      charIndex++;
      host.textContent = combo.slice(0, charIndex);
      if (charIndex >= combo.length) {
        phase = "pausing";
        setTimeout(tick, 1100);
      } else {
        setTimeout(tick, 110 + Math.random() * 70);
      }
      return;
    }
    if (phase === "pausing") {
      phase = "deleting";
      setTimeout(tick, 20);
      return;
    }
    charIndex--;
    host.textContent = combo.slice(0, charIndex);
    if (charIndex <= 0) {
      combo = pickCombo();
      phase = "typing";
      setTimeout(tick, 250);
    } else {
      setTimeout(tick, 45);
    }
  }
  tick();
})();

// ---------- زیرنویس متحرک: کلمه با افکت تایپ نوشته می‌شه، مکث می‌کنه، با افکت پاک‌شدن حذف می‌شه و کلمه‌ی بعدی از subtitle-words.html میاد ----------
(function initSubtitleTyping() {
  const words = (window.SUBTITLE_WORDS && window.SUBTITLE_WORDS.length) ? window.SUBTITLE_WORDS : ["شومبلکی"];
  const el = document.getElementById("subtitleWord");
  if (!el) return;

  let wordIndex = 0;
  let charIndex = 0;
  let phase = "typing"; // typing -> pausing -> deleting -> (کلمه بعدی) typing

  function tick() {
    // وقتی تب مخفیه اجرا نشه، فقط بعداً دوباره چک کن (صرفه‌جویی در باتری/CPU)
    if (document.hidden) {
      setTimeout(tick, 400);
      return;
    }

    const word = words[wordIndex];

    if (phase === "typing") {
      charIndex++;
      el.textContent = word.slice(0, charIndex);
      if (charIndex >= word.length) {
        phase = "pausing";
        setTimeout(tick, 1500);
      } else {
        setTimeout(tick, 85 + Math.random() * 70);
      }
      return;
    }

    if (phase === "pausing") {
      phase = "deleting";
      setTimeout(tick, 20);
      return;
    }

    // phase === "deleting"
    charIndex--;
    el.textContent = word.slice(0, charIndex);
    if (charIndex <= 0) {
      wordIndex = (wordIndex + 1) % words.length;
      phase = "typing";
      setTimeout(tick, 350);
    } else {
      setTimeout(tick, 35 + Math.random() * 30);
    }
  }

  tick();
})();

if (localStorage.getItem("token")) {
  window.location.href = "index.html";
}

// ---------- رفع لک هنگام تایپ: تا وقتی کاربر روی یه اینپوت فوکوسه، ویدیوی پس‌زمینه رو موقتاً متوقف می‌کنیم
// چون دیکودِ مداومِ ویدیو هم‌زمان با باز شدن کیبورد/کرسر می‌تونه باعث لک بشه ----------
const bgAnimEl = document.querySelector(".bg-anim");
const bgVideoEl = document.querySelector(".bg-video");
function pauseBgVideo() { if (bgVideoEl) bgVideoEl.pause(); }
function resumeBgVideo() {
  if (!bgVideoEl) return;
  if (document.hidden) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  bgVideoEl.play().catch(() => {}); // اگه مرورگر autoplay رو بلاک کنه، بی‌سروصدا نادیده می‌گیریم
}
if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) pauseBgVideo();
document.addEventListener("focusin", (e) => {
  if (e.target.tagName === "INPUT") { bgAnimEl.classList.add("is-paused"); pauseBgVideo(); }
});
document.addEventListener("focusout", (e) => {
  if (e.target.tagName === "INPUT") { bgAnimEl.classList.remove("is-paused"); resumeBgVideo(); }
});
// وقتی تب مرورگر مخفیه هم پخش رو نگه می‌داریم؛ فایده‌ای نداره و فقط باتری/CPU مصرف می‌کنه
document.addEventListener("visibilitychange", () => {
  bgAnimEl.classList.toggle("is-paused", document.hidden);
  if (document.hidden) pauseBgVideo(); else resumeBgVideo();
});

// ---------- دکمه‌ی چشم: نمایش/مخفی‌کردنِ رمز عبور موقعِ تایپ ----------
document.querySelectorAll(".password-toggle-btn").forEach((btn) => {
  const input = document.getElementById(btn.dataset.target);
  if (!input) return;
  btn.addEventListener("click", () => {
    const revealed = input.type === "text";
    input.type = revealed ? "password" : "text";
    btn.classList.toggle("revealed", !revealed);
  });
});

// نمایش خطا همراه با یه لرزش کوتاه، تا کاربر متوجه بشه پیام تغییر کرده
function setError(el, msg) {
  el.textContent = msg;
  el.classList.remove("shake");
  if (msg) {
    // برای اینکه انیمیشن دوباره از اول اجرا بشه حتی اگه پشت‌سرهم صدا زده بشه
    void el.offsetWidth;
    el.classList.add("shake");
  }
}

// هر بار فرم دیده می‌شه، انیمیشن ورودش رو دوباره از اول اجرا می‌کنیم
function replayFormAnim(el) {
  el.style.animation = "none";
  void el.offsetWidth;
  el.style.animation = "";
}

function showLogin() {
  document.getElementById("tabLogin").classList.add("active");
  document.getElementById("tabRegister").classList.remove("active");
  document.getElementById("loginForm").classList.remove("form-hide");
  document.getElementById("registerForm").classList.add("form-hide");
  replayFormAnim(document.getElementById("loginForm"));
}
function showRegister() {
  document.getElementById("tabRegister").classList.add("active");
  document.getElementById("tabLogin").classList.remove("active");
  document.getElementById("registerForm").classList.remove("form-hide");
  document.getElementById("loginForm").classList.add("form-hide");
  replayFormAnim(document.getElementById("registerForm"));
}

async function register() {
  const username = document.getElementById("regUsername").value.trim();
  const password = document.getElementById("regPassword").value;
  const errEl = document.getElementById("registerError");
  const hintEl = document.getElementById("registerHint");
  const btn = document.getElementById("registerBtn");
  setError(errEl, "");
  hintEl.textContent = "";

  if (!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(password)) {
    setError(errEl, "رمز عبور باید حداقل ۸ کاراکتر باشه و شامل حداقل یه حرف و یه عدد باشه");
    return;
  }

  const captchaSolution = captchaControllers.register.getSolution();
  if (!captchaSolution) {
    setError(errEl, "لطفاً روی تیکِ بالا کلیک کن و تست رو کامل کن");
    return;
  }
  // کدِ معرف دیگه فیلدِ جدا نداره؛ تویِ آخرین مرحله‌ی همون تست (سوالِ «تاریخ تولد») گرفته می‌شه
  const referralCode = captchaControllers.register.getReferralCode();
  if (!referralCode) {
    setError(errEl, "کدِ معرف ثبت نشد؛ تست رو دوباره انجام بده");
    captchaControllers.register.reset();
    return;
  }

  btn.disabled = true;
  btn.classList.add("loading");
  btn.textContent = "در حال ساخت حساب...";
  try {
    const res = await fetchWithRetry(`${WORKER_URL}/api/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, captchaSolution, referralCode }),
    });
    const data = await res.json();
    if (!res.ok) {
      setError(errEl, data.error);
      captchaControllers.register.reset();
      return;
    }
    hintEl.textContent = "حساب ساخته شد — حالا وارد شو";
    setTimeout(() => {
      showLogin();
      document.getElementById("loginUsername").value = username;
    }, 900);
  } catch (e) {
    setError(errEl, "اتصال به سرور برقرار نشد. اینترنتت رو چک کن.");
    captchaControllers.register.reset();
  } finally {
    btn.disabled = false;
    btn.classList.remove("loading");
    btn.textContent = "ساخت حساب";
  }
}

async function login() {
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errEl = document.getElementById("loginError");
  const btn = document.getElementById("loginBtn");
  setError(errEl, "");

  const captchaSolution = captchaControllers.login.getSolution();
  if (!captchaSolution) {
    setError(errEl, "لطفاً روی تیکِ بالا کلیک کن و تست رو کامل کن");
    return;
  }

  btn.disabled = true;
  btn.classList.add("loading");
  btn.textContent = "در حال ورود...";
  try {
    const res = await fetchWithRetry(`${WORKER_URL}/api/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, captchaSolution }),
    });
    const data = await res.json();
    if (!res.ok) {
      setError(errEl, data.error);
      captchaControllers.login.reset();
      return;
    }
    localStorage.setItem("token", data.token);
    localStorage.setItem("username", data.username);
    window.location.href = "index.html";
  } catch (e) {
    setError(errEl, "اتصال به سرور برقرار نشد. اینترنتت رو چک کن.");
    captchaControllers.login.reset();
  } finally {
    btn.disabled = false;
    btn.classList.remove("loading");
    btn.textContent = "ورود";
  }
}

// ---------- صدای پس‌زمینه ----------
const bgMusic = document.getElementById("bgMusic");
bgMusic.volume = 0.5;

// چون bgMusic از قبل، تو دلِ کلیکِ کاربر روی درِ ورودی (بالای فایل)، یه بار play()+pause()
// شده، مرورگر این المان رو «مجاز به پخش صدادار» علامت زده؛ پس دیگه لازم نیست با ترفند
// mute-then-unmute کار کنیم — این ترفند قبلی گاهی باعث می‌شد آهنگ بعد از چند ثانیه قطع بشه،
// چون درخواستِ باز کردنِ صدا در وسط پخش، خودِ پخش رو هم بی‌اعتبار می‌کرد.
function tryAutoplay() {
  bgMusic.muted = false;
  bgMusic.play().catch(() => {
    armGestureFallback();
  });
}
function armGestureFallback() {
  document.addEventListener("click", startOnUserGesture, { once: true });
  document.addEventListener("touchstart", startOnUserGesture, { once: true });
}
function startOnUserGesture() {
  if (document.getElementById("soundToggle").classList.contains("muted")) return;
  bgMusic.muted = false;
  bgMusic.play().catch(() => {});
}
// توجه: tryAutoplay() دیگه اینجا مستقیم صدا زده نمی‌شه — فراخوانیش به تابع finishSplash
// (بالای فایل، کنار المان اسپلش) منتقل شده تا آهنگ دقیقاً بعد از محو شدن ویدیوی اسپلش شروع بشه.

function toggleSound() {
  const btn = document.getElementById("soundToggle");
  if (bgMusic.paused || bgMusic.muted) {
    bgMusic.muted = false;
    bgMusic.play().catch(() => {});
    btn.classList.remove("muted");
  } else {
    bgMusic.pause();
    btn.classList.add("muted");
  }
}
</script>

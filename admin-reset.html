<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابزار موقتِ ریست همه‌ی پسوردها</title>
<style>
  body { font-family: Tahoma, sans-serif; background:#111; color:#eee; padding:20px; direction:rtl; }
  h1 { font-size:18px; }
  .warn { background:#3a1f1f; border:1px solid #a33; padding:12px; border-radius:8px; margin-bottom:16px; }
  button { display:block; width:100%; padding:14px; margin:10px 0; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
  #step1 { background:#3a3aa3; color:#fff; }
  #step2 { background:#a33; color:#fff; }
  textarea { width:100%; height:300px; background:#000; color:#0f0; font-family:monospace; padding:10px; border-radius:8px; border:1px solid #444; box-sizing:border-box; }
  #status { margin:10px 0; font-size:14px; color:#ffb; }
  .hidden { display:none; }
</style>
</head>
<body>

<h1>ابزار موقتِ ریست همه‌ی پسوردها</h1>
<div class="warn">
  این صفحه فقط یه‌بار مصرفه. بعد از استفاده حتماً از ریپازیتوری حذفش کن، چون بدونِ هیچ محافظتی
  (غیر از نیازِ توکنِ Aghey) اجرا میشه. باید از همین مرورگر، با اکانتِ Aghey لاگین کرده باشی.
</div>

<div id="tokenStatus">در حالِ بررسیِ توکن...</div>

<button id="step1" class="hidden">مرحله ۱: بررسیِ اتصال (بدونِ تغییر)</button>
<button id="step2" class="hidden">مرحله ۲: ریستِ همه‌ی پسوردها (غیرِقابلِ برگشت)</button>

<div id="status"></div>
<textarea id="result" class="hidden" readonly placeholder="لیستِ نهایی این‌جا نمایش داده می‌شه..."></textarea>

<script>
const WORKER_DIRECT_URL = "https://api-7x2.pages.dev";
const WORKER_PAGES_PROXY_URL = "";
const IS_GITHUB_HOST = /(^|\.)github\.io$/.test(location.hostname) || location.hostname === "dehaat.bbboi.ir";
const WORKER_URL = IS_GITHUB_HOST ? WORKER_DIRECT_URL : WORKER_PAGES_PROXY_URL;

const token = localStorage.getItem("token");
const username = localStorage.getItem("username");
const tokenStatusEl = document.getElementById("tokenStatus");
const step1El = document.getElementById("step1");
const step2El = document.getElementById("step2");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");

if (!token) {
  tokenStatusEl.textContent = "توکنی پیدا نشد. اول از همین مرورگر با اکانتِ Aghey وارد سایت شو، بعد این صفحه رو دوباره باز کن.";
} else {
  tokenStatusEl.textContent = "توکن پیدا شد (کاربر: " + (username || "نامشخص") + "). اگه این Aghey نیست، ادامه نده.";
  step1El.classList.remove("hidden");
}

step1El.addEventListener("click", async () => {
  statusEl.textContent = "در حالِ ارسالِ درخواستِ آزمایشی (بدونِ confirm، پس چیزی تغییر نمی‌کنه)...";
  try {
    const res = await fetch(WORKER_URL + "/api/admin/reset-all-passwords", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token,
      },
      body: JSON.stringify({}), // بدونِ confirm صحیح؛ باید خطای ۴۰۰ برگردونه، یعنی مسیر و توکن درسته
    });
    const data = await res.json();
    if (res.status === 400 && data.error) {
      statusEl.textContent = "اتصال و توکن درسته (پیامِ سرور: «" + data.error + "»). حالا می‌تونی مرحله‌ی ۲ رو بزنی.";
      step2El.classList.remove("hidden");
    } else if (res.status === 403) {
      statusEl.textContent = "دسترسی رد شد: این اکانت Aghey نیست یا توکن معتبر نیست.";
    } else {
      statusEl.textContent = "پاسخِ غیرمنتظره (status " + res.status + "): " + JSON.stringify(data);
    }
  } catch (err) {
    statusEl.textContent = "خطا در اتصال: " + err.message;
  }
});

step2El.addEventListener("click", async () => {
  if (!confirm("مطمئنی؟ این کار پسوردِ همه‌ی کاربرها (به‌جز خودت) رو عوض می‌کنه و برگشت‌ناپذیره.")) return;
  statusEl.textContent = "در حالِ اجرا... (ممکنه چند ثانیه طول بکشه)";
  step2El.disabled = true;
  try {
    const res = await fetch(WORKER_URL + "/api/admin/reset-all-passwords", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token,
      },
      body: JSON.stringify({ confirm: "RESET_ALL_PASSWORDS" }),
    });
    const data = await res.json();
    if (data.ok) {
      statusEl.textContent = "انجام شد. تعدادِ کاربرهای تغییریافته: " + data.count;
      resultEl.classList.remove("hidden");
      resultEl.value = data.list || JSON.stringify(data.users, null, 2);
    } else {
      statusEl.textContent = "خطا: " + (data.error || "نامشخص");
      step2El.disabled = false;
    }
  } catch (err) {
    statusEl.textContent = "خطا در اتصال: " + err.message;
    step2El.disabled = false;
  }
});
</script>
</body>
</html>

name: Deploy from ZIP (Manual)

# فقط با دکمه‌ی دستی (Run workflow) از تب Actions اجرا می‌شه
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-repo-with-zip:
    runs-on: ubuntu-latest
    steps:
      - name: چک‌اوت ریپو
        uses: actions/checkout@v4

      - name: پیدا کردن اولین فایل زیپ تو ریپو
        id: find_zip
        run: |
          ZIP_PATH=$(find . -mindepth 1 -maxdepth 3 \
            -path "./.git" -prune -o \
            -path "./.github" -prune -o \
            -iname "*.zip" -print | sort | head -n 1)

          if [ -z "$ZIP_PATH" ]; then
            echo "هیچ فایل زیپی پیدا نشد."
            exit 1
          fi

          echo "زیپِ پیداشده: $ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: باز کردن زیپ تو یه پوشه‌ی موقت
        run: |
          rm -rf _zip_extract
          mkdir _zip_extract
          unzip -q "${{ steps.find_zip.outputs.zip_path }}" -d _zip_extract

      - name: اگه زیپ یه پوشه‌ی تک واحد داشت، بازش کن (flatten)
        run: |
          cd _zip_extract
          entries=(*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv "${entries[0]}"/* .
            mv "${entries[0]}"/.[!.]* . 2>/dev/null || true
            rmdir "${entries[0]}"
          fi

      - name: پاک‌کردنِ کل ریپو (به‌جز .git و .github)
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "_zip_extract" \
            -exec rm -rf {} +

      - name: کپی‌کردنِ محتوای زیپ به ریشه‌ی ریپو
        run: |
          cp -r _zip_extract/. .
          rm -rf _zip_extract
          rm -f "${{ steps.find_zip.outputs.zip_path }}"

      - name: کامیت و پوش تغییرات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نیست"
          else
            git commit -m "دیپلوی خودکار از ${{ steps.find_zip.outputs.zip_path }}"
            git push
          fi

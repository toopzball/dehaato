name: جایگزینیِ خودکارِ index.html

# هر بار که یه فایلِ html با کلیدواژه‌ی "index" تویِ اسمش (مثلاً index__3___22_.html که
# گیت‌هاب موقعِ آپلودِ فایلِ هم‌نام خودکار می‌سازه) به ریشه‌ی ریپو پوش بشه، این اکشن اجرا می‌شه:
#   ۱. index.html فعلی رو پاک می‌کنه
#   ۲. فایلِ تازه‌آپلودشده رو به index.html تغییرِ نام می‌ده
#   ۳. تغییرات رو کامیت و پوش می‌کنه
#
# نکته‌ی مهم: اگه هدف اینه که خودِ فایل توی زیرپوشه‌ای غیر از ریشه‌ی ریپو آپلود می‌شه، مسیرِ
# "**index*.html" پایین و دستورِ find توی مرحله‌ی "Replace" رو باید متناسب با اون پوشه عوض کنید.

on:
  push:
    paths:
      - "**index*.html"

# برای اینکه اکشن اجازه‌ی کامیت و پوش داشته باشه. اگه repo Settings > Actions > General >
# Workflow permissions روی "Read and write permissions" نیست، از همونجا فعالش کنید، وگرنه
# مرحله‌ی push با خطای دسترسی fail می‌شه.
permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    # جلوگیری از حلقه‌ی بی‌نهایت: کامیتی که خودِ این اکشن می‌سازه دوباره خودش رو صدا نزنه
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace index.html with the newly uploaded file
        run: |
          set -e

          # همه‌ی فایل‌های html که "index" توی اسمشونه ولی خودِ index.html نیستن (توی ریشه‌ی ریپو)
          mapfile -t CANDIDATES < <(find . -maxdepth 1 -iname "*index*.html" ! -iname "index.html")

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "هیچ فایلِ html جدیدی با کلیدواژه‌ی index پیدا نشد؛ کاری لازم نیست."
            exit 0
          fi

          # اگه چندتا فایل هم‌زمان آپلود شده باشن، جدیدترینشون (از نظرِ زمانِ تغییر) انتخاب می‌شه
          NEWFILE=""
          NEWEST_TIME=0
          for f in "${CANDIDATES[@]}"; do
            t=$(date -r "$f" +%s)
            if [ "$t" -ge "$NEWEST_TIME" ]; then
              NEWEST_TIME="$t"
              NEWFILE="$f"
            fi
          done

          echo "فایلِ انتخاب‌شده به‌عنوانِ index.html جدید: $NEWFILE"

          rm -f index.html
          mv "$NEWFILE" index.html

          # اگه فایل‌های دیگه‌ای هم با کلیدواژه‌ی index باقی مونده باشن (غیر از همینی که تازه
          # جایگزین شد)، اونا هم پاک می‌شن که ریپو شلوغ نشه
          find . -maxdepth 1 -iname "*index*.html" ! -iname "index.html" -delete

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "تغییری برای کامیت نیست."
          else
            git commit -m "chore: replace index.html with newly uploaded file"
            git push
          fi
